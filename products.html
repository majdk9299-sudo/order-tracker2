<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: #FAF3F0; color: #2B1F22; padding: 20px; }
        .header { background: #6B2737; color: #fff; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .back-btn { display: inline-block; margin-bottom: 15px; background: #fff; color: #6B2737; padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 700; }
        .product-card { background: #fff; border-radius: 14px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .input { width: 100%; padding: 10px; border: 1px solid #E7D3D6; border-radius: 10px; margin-bottom: 10px; font-family: 'Tajawal', sans-serif; }
        .btn { background: #6B2737; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 700; font-family: 'Tajawal', sans-serif; cursor: pointer; }
    </style>
</head>
<body>

    <a href="./index.html" class="back-btn">← عودة لدفتر الطلبات</a>

    <div class="header">
        <h1>كتالوج المنتجات والمخزون</h1>
        <p>إدارة المنتجات والألوان والمقاسات</p>
    </div>

    <div style="background:#fff; padding:15px; border-radius:14px; margin-bottom:20px;">
        <h3 style="color:#6B2737; margin-bottom:10px;">إضافة منتج جديد</h3>
        <input type="text" id="pName" class="input" placeholder="اسم المنتج (مثلاً: فستان سهرة)">
        <select id="pSource" class="input">
            <option value="محلي">محلي</option>
            <option value="خارجي">خارجي</option>
        </select>
        <button class="btn" onclick="addProduct()">حفظ المنتج</button>
    </div>

    <div id="productsList"></div>

    <script>
        const DB_NAME = "orderTrackerDB";
        const STORE_NAME = "appdata";
        let db;
        let products = [];

        function openDB() {
            return new Promise(function(resolve, reject) {
                const req = indexedDB.open(DB_NAME);
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e); };
            });
        }

        async function init() {
            try {
                db = await openDB();
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get("products");
                req.onsuccess = function() {
                    products = req.result || [];
                    render();
                };
            } catch(e) {
                products = [];
                render();
            }
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const source = document.getElementById('pSource').value;
            if(!name) { alert('يرجى كتابة اسم المنتج'); return; }

            products.unshift({ id: Date.now(), name, source, colors: [] });
            
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(products, "products");
            tx.oncomplete = function() {
                document.getElementById('pName').value = "";
                render();
            };
        }

        function render() {
            const list = document.getElementById('productsList');
            if(products.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#8B7377; padding:20px;">لا توجد منتجات مسجلة حالياً</div>';
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="product-card">
                    <h3 style="color:#6B2737;">${p.name}</h3>
                    <p style="font-size:12px; color:#8B7377; margin-top:4px;">المصدر: ${p.source}</p>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
