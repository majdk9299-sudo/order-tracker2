<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
(function () {
  function box() {
    var b = document.getElementById('fatalBox');
    if (!b) {
      b = document.createElement('div');
      b.id = 'fatalBox';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#FBE4E4;color:#7A1F1F;padding:14px 16px;font:13px/1.7 Tahoma,Arial,sans-serif;direction:rtl;border-bottom:2px solid #9A3B3B;max-height:60vh;overflow:auto;';
      (document.body || document.documentElement).appendChild(b);
    }
    return b;
  }
  window.showFatal = function (msg) { box().innerHTML = '⚠️ ' + String(msg).replace(/</g, '&lt;'); };
  window.clearFatal = function () { var b = document.getElementById('fatalBox'); if (b) b.remove(); };
  window.addEventListener('error', function (e) {
    window.showFatal('خطأ بالتطبيق: ' + (e.message || '') + ' (سطر ' + (e.lineno || '?') + ')');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason; window.showFatal('خطأ: ' + ((r && r.message) || r));
  });
})();
</script>

<div id="app"></div>
<input type="file" id="restoreInput" accept=".json,application/json" style="display:none" onchange="restoreBackup(this)">
<script>
const DB_NAME = "orderTrackerDB";
const DB_VERSION = 2; // لازم نفس الرقم في index.html
const STORE_NAME = "appdata";
let db;
let products = [];
let saveErrorShown = false;

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function openDB() {
  return new Promise(function(resolve, reject) {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e) {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) {
        d.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = function(e) {
      const d = e.target.result;
      d.onversionchange = function() { d.close(); };
      window.clearFatal(); resolve(d);
    };
    req.onerror = function(e) { reject(e); };
    req.onblocked = function() { window.showFatal('التطبيق مفتوح بنافذة أو تبويب ثاني. أغلقي كل نوافذ التطبيق (من الخلفية كمان) ثم افتحيه من جديد.'); };
  });
}
function readKey(key) {
  return new Promise(function(resolve) {
    try {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = function() { resolve(req.result || []); };
      req.onerror = function() { resolve([]); };
    } catch (e) { resolve([]); }
  });
}
function loadProducts() { return readKey("products"); }
function warnSaveError() {
  if (saveErrorShown) return;
  saveErrorShown = true;
  alert('تعذر حفظ البيانات على الجهاز! خذي نسخة احتياطية الحين (💾 فوق) وتأكدي من مساحة التخزين.');
}
function persistProducts() {
  if (!db) { warnSaveError(); return; }
  try {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(products, "products");
    tx.onerror = tx.onabort = function() { warnSaveError(); };
  } catch (e) { warnSaveError(); }
}
async function initApp() {
  try {
    db = await openDB();
    products = await loadProducts();
    if (navigator.storage && navigator.storage.persist) { navigator.storage.persist(); }
  } catch (e) {
    db = null; products = [];
    alert('تعذر فتح قاعدة البيانات. بياناتك غير محذوفة — حدّثي الصفحة أو أغلقي التطبيق وافتحيه من جديد.');
  }
  render();
}

// ---- نسخة احتياطية / استرجاع ----
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
async function backupAll() {
  const customers = await readKey("customers");
  const payload = { app: "daftar-talabat", version: 1, exportedAt: new Date().toISOString(), customers: customers, products: products };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'نسخة_احتياطية_' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
  try { localStorage.setItem('lastBackupAt', String(Date.now())); } catch (e) {}
  showBackup = false; render();
}
function restoreBackup(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { alert('الملف غير صالح.'); return; }
    if (!data || data.app !== 'daftar-talabat' || !Array.isArray(data.customers)) {
      alert('هذا الملف ليس نسخة احتياطية من دفتر الطلبات.'); return;
    }
    const prods = Array.isArray(data.products) ? data.products : [];
    if (!confirm('النسخة فيها ' + data.customers.length + ' زبونة و ' + prods.length + ' منتج.\n\nسيتم استبدال كل البيانات الحالية بها. هل أنتِ متأكدة؟')) return;
    try {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      store.put(data.customers, "customers");
      store.put(prods, "products");
      tx.oncomplete = function() { alert('تم الاسترجاع ✅'); location.reload(); };
      tx.onerror = tx.onabort = function() { alert('فشل الاسترجاع، بياناتك الحالية لم تتغير.'); };
    } catch (e) { alert('فشل الاسترجاع.'); }
  };
  reader.readAsText(file);
}
function backupAgeText() {
  let t = 0;
  try { t = parseInt(localStorage.getItem('lastBackupAt') || '0', 10) || 0; } catch (e) {}
  if (!t) return 'ما أخذتي نسخة احتياطية من هذا الجهاز بعد';
  return 'آخر نسخة احتياطية: قبل ' + Math.floor((Date.now() - t) / 86400000) + ' يوم';
}

const SOURCES = [{id:"local",label:"محلي"},{id:"china",label:"صيني"},{id:"shein",label:"شي إن"}];
const SIZE_OPTIONS = ["XS","S","M","L","XL","XXL"];

let search = "";
let sourceFilter = "all";
let stockFilter = "all";
let showFilters = false;
let showForm = false;
let showBackup = false;
let editingProductId = null;
let detailId = null;
let detailColorId = null;
let detailImgIdx = 0;

// form state
let fName = "", fSource = "local", fThreshold = "3", fSizes = [];
let fColors = [];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function save() { persistProducts(); render(); }

function newColorRow() {
  return { id: uid(), name: "", hex: "#7CC9A9", qty: "", images: [] };
}
function openForm() {
  editingProductId = null;
  fName = ""; fSource = "local"; fThreshold = "3"; fSizes = [];
  fColors = [newColorRow()];
  showForm = true; render();
}
function closeForm() {
  showForm = false;
  if (editingProductId) { detailId = editingProductId; editingProductId = null; }
  render();
}
function openEdit(id) {
  const p = products.find(function(x){ return x.id === id; });
  if (!p) return;
  editingProductId = id;
  fName = p.name; fSource = p.source || "local"; fThreshold = String(p.threshold || 3);
  fSizes = (p.sizes || []).slice();
  fColors = p.colors.map(function(c) {
    return { id: c.id, name: c.name, hex: c.hex || "#7CC9A9", qty: String(c.qty), images: (c.images || []).slice() };
  });
  detailId = null;
  showForm = true;
  render();
}
function toggleFSize(s) {
  const i = fSizes.indexOf(s);
  if (i === -1) fSizes.push(s); else fSizes.splice(i,1);
  render();
}
function addColorRow() { fColors.push(newColorRow()); render(); }
function removeColorRow(id) { fColors = fColors.filter(function(c){return c.id!==id;}); render(); }
function updateColorField(id, field, val) {
  fColors = fColors.map(function(c){ return c.id===id ? Object.assign({}, c, {[field]: val}) : c; });
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const maxDim = 700;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h*(maxDim/w)); w = maxDim; }
        else { w = Math.round(w*(maxDim/h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      let dataUrl;
      try { dataUrl = canvas.toDataURL('image/jpeg', 0.72); }
      catch(err) { dataUrl = e.target.result; }
      callback(dataUrl);
    };
    img.onerror = function(){ callback(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleColorImages(colorId, files) {
  Array.from(files).forEach(function(file) {
    compressImage(file, function(dataUrl) {
      fColors = fColors.map(function(c) {
        if (c.id !== colorId) return c;
        const imgs = (c.images || []).slice();
        if (imgs.length < 4) imgs.push(dataUrl);
        return Object.assign({}, c, { images: imgs });
      });
      render();
    });
  });
}
function removeColorImage(colorId, idx) {
  fColors = fColors.map(function(c) {
    if (c.id !== colorId) return c;
    const imgs = (c.images||[]).slice();
    imgs.splice(idx,1);
    return Object.assign({}, c, { images: imgs });
  });
  render();
}
function canSaveForm() {
  return fName.trim() && fColors.some(function(c){ return c.name.trim() && c.qty !== ""; });
}
function submitForm() {
  if (!canSaveForm()) return;
  const cleanColors = fColors.filter(function(c){ return c.name.trim() && c.qty !== ""; })
    .map(function(c){ return Object.assign({}, c, { qty: parseInt(c.qty)||0 }); });
  if (editingProductId) {
    products = products.map(function(p) {
      if (p.id !== editingProductId) return p;
      return Object.assign({}, p, {
        name: fName.trim(), source: fSource,
        threshold: parseInt(fThreshold)||3, sizes: fSizes.slice(),
        colors: cleanColors
      });
    });
    const eid = editingProductId;
    editingProductId = null;
    showForm = false;
    detailId = eid;
    const ep = products.find(function(p){ return p.id === eid; });
    detailColorId = ep && ep.colors[0] ? ep.colors[0].id : null;
    detailImgIdx = 0;
    save();
    return;
  }
  products.unshift({
    id: uid(), name: fName.trim(), source: fSource,
    threshold: parseInt(fThreshold)||3, sizes: fSizes.slice(),
    colors: cleanColors
  });
  showForm = false;
  save();
}
function removeProduct(id) {
  if (!confirm('حذف هذا المنتج نهائياً؟')) return;
  products = products.filter(function(p){ return p.id !== id; });
  detailId = null;
  save();
}
function adjustQty(productId, colorId, delta) {
  products = products.map(function(p) {
    if (p.id !== productId) return p;
    return Object.assign({}, p, { colors: p.colors.map(function(c) {
      return c.id === colorId ? Object.assign({}, c, { qty: Math.max(0, c.qty + delta) }) : c;
    })});
  });
  save();
}
function openDetail(id) {
  detailId = id;
  const p = products.find(function(x){return x.id===id;});
  detailColorId = p && p.colors[0] ? p.colors[0].id : null;
  detailImgIdx = 0;
  render();
}
function closeDetail() { detailId = null; render(); }
function selectDetailColor(cid) { detailColorId = cid; detailImgIdx = 0; render(); }
function galleryNav(delta) {
  const p = products.find(function(x){ return x.id === detailId; });
  if (!p) return;
  const c = p.colors.find(function(x){ return x.id === detailColorId; }) || p.colors[0];
  const images = (c && c.images) || [];
  if (!images.length) return;
  detailImgIdx = (detailImgIdx + delta + images.length) % images.length;
  render();
}

function productStock(p) { return p.colors.reduce(function(s,c){return s+c.qty;},0); }
function stockStatus(p) {
  const total = productStock(p);
  if (total === 0) return "out";
  const anyLow = p.colors.some(function(c){ return c.qty>0 && c.qty<=(p.threshold||3); });
  const anyOut = p.colors.some(function(c){ return c.qty===0; });
  if (anyLow || anyOut) return "low";
  return "ok";
}

function render() {
  const prevSearchEl = document.getElementById('searchInput');
  const searchHadFocus = prevSearchEl && document.activeElement === prevSearchEl;
  const searchCursor = searchHadFocus ? prevSearchEl.selectionStart : null;
  const filtered = products.filter(function(p) {
    if (search.trim() && p.name.toLowerCase().indexOf(search.trim().toLowerCase()) === -1) return false;
    if (sourceFilter !== "all" && p.source !== sourceFilter) return false;
    if (stockFilter !== "all") {
      const st = stockStatus(p);
      if (stockFilter === "out" && st !== "out") return false;
      if (stockFilter === "low" && st !== "low") return false;
      if (stockFilter === "available" && st === "out") return false;
    }
    return true;
  });

  const totalPieces = products.reduce(function(s,p){return s+productStock(p);},0);
  const lowCount = products.filter(function(p){return stockStatus(p)==="low";}).length;
  const outCount = products.filter(function(p){return stockStatus(p)==="out";}).length;
  const activeFilterCount = (sourceFilter!=="all"?1:0) + (stockFilter!=="all"?1:0);

  let html = `
  <div class="header">
    <div class="header-top">
      <a class="brand-mark" href="./index.html" title="الرجوع لدفتر الطلبات">←</a>
      <div style="flex:1;">
        <div class="header-title">كتالوج المنتجات</div>
        <div class="header-sub">الصور والألوان والمقاسات والكمية بمكان واحد</div>
      </div>
      <button class="brand-mark" style="border:none;cursor:pointer;" title="نسخة احتياطية" onclick="showBackup=true; render();">💾</button>
    </div>
    <div class="stats-row">
      <div class="stat-tag"><span class="stat-num">${products.length}</span><span class="stat-label">منتج</span></div>
      <div class="stat-tag" style="background:#FDF0D8;"><span class="stat-num" style="color:#8A6A1F;">${lowCount}</span><span class="stat-label" style="color:#8A6A1F;">شارف على النفاد</span></div>
      <div class="stat-tag" style="background:#FBE4E4;"><span class="stat-num" style="color:#9A3B3B;">${outCount}</span><span class="stat-label" style="color:#9A3B3B;">نفد</span></div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" class="input" style="border-radius:14px;" placeholder="🔍 ابحثي عن منتج..." id="searchInput" value="${esc(search)}" oninput="search=this.value; render();">
  </div>

  <div class="filter-row">
    <button class="filter-icon-btn ${activeFilterCount>0?'active':''}" onclick="showFilters=!showFilters; render();">⚙️ فلترة ${activeFilterCount>0?('('+activeFilterCount+')'):''}</button>
  </div>
  <div class="more-filters ${showFilters?'show':''}">
    <div class="filter-field">
      <label class="filter-label">المصدر</label>
      <select class="filter-select" onchange="sourceFilter=this.value; render();">
        <option value="all" ${sourceFilter==='all'?'selected':''}>الكل</option>
        ${SOURCES.map(function(s){return `<option value="${s.id}" ${sourceFilter===s.id?'selected':''}>${s.label}</option>`;}).join('')}
      </select>
    </div>
    <div class="filter-field">
      <label class="filter-label">حالة المخزون</label>
      <select class="filter-select" onchange="stockFilter=this.value; render();">
        <option value="all" ${stockFilter==='all'?'selected':''}>الكل</option>
        <option value="available" ${stockFilter==='available'?'selected':''}>متوفر</option>
        <option value="low" ${stockFilter==='low'?'selected':''}>شارف على النفاد</option>
        <option value="out" ${stockFilter==='out'?'selected':''}>نفد</option>
      </select>
    </div>
  </div>

  <div class="grid">
    ${filtered.length===0 ? `<div class="empty-state" style="grid-column:1/-1;">${products.length===0?'ما فيه منتجات بعد — أضيفي أول منتج':'ما فيه نتائج مطابقة'}</div>` :
    filtered.map(function(p) {
      const status = stockStatus(p);
      const coverColor = p.colors.find(function(c){return c.images && c.images.length;});
      const cover = coverColor ? coverColor.images[0] : null;
      return `
      <div class="product-card" onclick="openDetail('${p.id}')">
        <div class="product-cover">
          ${cover ? `<img src="${cover}">` : '📷'}
          ${status!=='ok' ? `<span class="product-badge ${status==='out'?'badge-out':'badge-low'}">${status==='out'?'نفد':'شارف'}</span>` : ''}
          <div class="product-swatches">
            ${p.colors.slice(0,4).map(function(c){return `<span class="product-swatch" style="background:${esc(c.hex||'#7CC9A9')}"></span>`;}).join('')}
          </div>
        </div>
        <div class="product-info">
        <div class="product-name">${esc(p.name)}</div>
          <div class="product-meta">${(SOURCES.find(function(s){return s.id===p.source;})||{}).label||''} · ${productStock(p)} قطعة</div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <button class="fab" onclick="openForm()">+ منتج جديد</button>

  <div class="sheet-overlay ${showBackup?'show':''}" onclick="showBackup=false; render();">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <div class="sheet-title">نسخة احتياطية</div>
        <button class="icon-btn" onclick="showBackup=false; render();">✕</button>
      </div>
      <div style="font-size:12.5px;color:#8B7377;">تشمل الطلبات والكتالوج مع الصور. خذيها بشكل دوري وخزنيها بمكان آمن (واتساب لنفسك أو درايف).</div>
      <button class="submit-btn" onclick="backupAll()">💾 تنزيل نسخة احتياطية</button>
      <button class="submit-btn" style="background:#fff;color:#6B2737;border:1px solid #D9BEC3;" onclick="document.getElementById('restoreInput').click()">♻️ استرجاع من نسخة</button>
      <div style="font-size:11.5px;color:#8B7377;margin-top:12px;text-align:center;">${backupAgeText()}</div>
    </div>
  </div>

  <div class="sheet-overlay ${showForm?'show':''}" onclick="closeForm()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <div class="sheet-title">${editingProductId ? 'تعديل المنتج' : 'منتج جديد'}</div>
        <button class="icon-btn" onclick="closeForm()">✕</button>
      </div>

      <label class="label">اسم المنتج</label>
      <input class="input" value="${esc(fName)}" oninput="fName=this.value" placeholder="مثال: فستان طويل">

      <label class="label">المصدر</label>
      <div class="chip-row">
        ${SOURCES.map(function(s){return `<button type="button" class="chip-btn ${fSource===s.id?'active':''}" onclick="fSource='${s.id}'; render();">${s.label}</button>`;}).join('')}
      </div>

      <label class="label">المقاسات المتوفرة (اختياري)</label>
      <div class="chip-row">
        ${SIZE_OPTIONS.map(function(s){return `<button type="button" class="chip-btn ${fSizes.indexOf(s)>-1?'active':''}" onclick="toggleFSize('${s}')">${s}</button>`;}).join('')}
      </div>

      <label class="label">تنبيه عند وصول الكمية إلى</label>
      <input class="input" style="width:80px;" type="number" value="${fThreshold}" oninput="fThreshold=this.value">

      <label class="label">الألوان والصور</label>
      ${fColors.map(function(c) {
        return `
        <div class="color-card">
          <div class="color-row-top">
            <input class="input" style="flex:1;" placeholder="اسم اللون" value="${esc(c.name)}" oninput="updateColorField('${c.id}','name',this.value)">
            <input class="color-swatch-input" type="color" value="${esc(c.hex)}" onchange="updateColorField('${c.id}','hex',this.value)">
            <input class="input" style="width:70px;" type="number" placeholder="الكمية" value="${esc(c.qty)}" oninput="updateColorField('${c.id}','qty',this.value)">
            ${fColors.length>1 ? `<button class="remove-color-btn" onclick="removeColorRow('${c.id}')">✕</button>` : ''}
          </div>
          <input type="file" id="camera_${c.id}" accept="image/*" capture="environment" style="display:none" onchange="handleColorImages('${c.id}', this.files); this.value='';">
          <input type="file" id="gallery_${c.id}" accept="image/*" multiple style="display:none" onchange="handleColorImages('${c.id}', this.files); this.value='';">
          <div class="upload-row">
            <button type="button" class="upload-btn" onclick="document.getElementById('camera_${c.id}').click()">📷 تصوير</button>
            <button type="button" class="upload-btn" onclick="document.getElementById('gallery_${c.id}').click()">🖼️ من المعرض</button>
          </div>
          ${(c.images&&c.images.length) ? `
          <div class="form-images-row">
            ${c.images.map(function(img,idx){return `<div class="form-thumb"><img src="${img}"><button class="remove-x" onclick="removeColorImage('${c.id}',${idx})">✕</button></div>`;}).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
      <button type="button" class="add-color-btn" onclick="addColorRow()">+ لون آخر</button>

      <button class="submit-btn" ${canSaveForm()?'':'disabled style="opacity:0.5;"'} onclick="submitForm()">${editingProductId ? 'حفظ التعديل' : 'حفظ المنتج'}</button>
    </div>
  </div>
  `;

  const detailProduct = products.find(function(p){return p.id===detailId;});
  if (detailProduct) {
    const color = detailProduct.colors.find(function(c){return c.id===detailColorId;}) || detailProduct.colors[0];
    const images = (color && color.images) || [];
    html += `
    <div class="sheet-overlay show" onclick="closeDetail()">
      <div class="sheet" style="padding:0; overflow:hidden;" onclick="event.stopPropagation()">
        <div class="sheet-header" style="padding:14px 20px 0;">
          <div class="sheet-title" style="font-size:17px;">${esc(detailProduct.name)}</div>
          <div style="display:flex; gap:14px; align-items:center;">
            <button class="icon-btn" onclick="openEdit('${detailProduct.id}')">✏️</button>
            <button class="icon-btn" onclick="removeProduct('${detailProduct.id}')">🗑️</button>
            <button class="icon-btn" onclick="closeDetail()">✕</button>
          </div>
        </div>
        <div class="detail-gallery">
          ${images.length ? `<img src="${images[detailImgIdx]}">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#C9A9AF;font-size:30px;">📷</div>'}
          ${images.length>1 ? `
            <button class="gallery-nav prev" onclick="galleryNav(1)">›</button>
            <button class="gallery-nav next" onclick="galleryNav(-1)">‹</button>
            <div class="gallery-dots">${images.map(function(_,i){return `<span class="gallery-dot ${i===detailImgIdx?'active':''}"></span>`;}).join('')}</div>
          ` : ''}
        </div>
        <div style="padding:14px 20px 20px;">
          <div class="tags-row">
            <span class="meta-tag">${(SOURCES.find(function(s){return s.id===detailProduct.source;})||{}).label||''}</span>
            ${detailProduct.sizes && detailProduct.sizes.length ? `<span class="meta-tag">مقاسات: ${esc(detailProduct.sizes.join(' / '))}</span>` : ''}
          </div>
          <label class="label" style="margin-top:2px;">الألوان</label>
          ${detailProduct.colors.map(function(c) {
            const isOut = c.qty===0, isLow = c.qty>0 && c.qty<=(detailProduct.threshold||3);
            const cls = c.id===(color&&color.id) ? 'active' : (isOut?'out':(isLow?'low':''));
            return `
            <div class="color-list-item ${cls}" onclick="selectDetailColor('${c.id}')">
              <div class="color-name-wrap">
                <span class="color-dot" style="background:${c.hex||'#7CC9A9'}"></span>
                <span>${esc(c.name)}</span>
                ${isOut?'⚠️':(isLow?'⚠️':'')}
              </div>
              <div class="qty-controls" onclick="event.stopPropagation()">
                <button class="qty-btn" onclick="adjustQty('${detailProduct.id}','${c.id}',-1)">−</button>
                <span class="qty-val">${c.qty}</span>
                <button class="qty-btn" onclick="adjustQty('${detailProduct.id}','${c.id}',1)">+</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }

  document.getElementById('app').innerHTML = html;
  if (searchHadFocus) {
    const el = document.getElementById('searchInput');
    if (el) { el.focus(); if (searchCursor !== null) el.setSelectionRange(searchCursor, searchCursor); }
  }
}

initApp();
</script>
</body>
</html>
