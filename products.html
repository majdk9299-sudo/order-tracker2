<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات والمخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: #FAF3F0; color: #2B1F22; padding: 12px; padding-bottom: 90px; }
        
        .header { background: linear-gradient(135deg, #6B2737 0%, #8A3A4C 100%); color: #fff; padding: 14px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-title h1 { font-size: 18px; font-weight: 800; }
        .header-title p { font-size: 11px; opacity: 0.85; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .back-btn { display: inline-flex; align-items: center; background: #fff; color: #6B2737; padding: 6px 12px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 12px; border: 1px solid #E7D3D6; }
        .search-toggle-btn { background: #6B2737; color: #fff; border: none; padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: 'Tajawal', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        .filter-section { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(107,39,55,0.08); display: none; border: 1px solid #E7D3D6; }
        .filter-section.show { display: block; }
        .filter-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .filter-select { flex: 1 1 100px; padding: 6px 8px; border: 1px solid #E7D3D6; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 11px; background: #fff; color: #2B1F22; outline: none; }
        
        .add-card-toggle { background: #6B2737; color: #fff; border-radius: 14px; padding: 14px; text-align: center; font-weight: 800; font-size: 14px; cursor: pointer; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(107,39,55,0.15); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(107,39,55,0.05); display: none; border: 1px solid #E7D3D6; }
        .card.show { display: block; }
        .card-title { color: #6B2737; font-size: 15px; font-weight: 800; margin-bottom: 10px; }
        
        .label { display: block; font-size: 11px; color: #8B7377; margin: 8px 0 3px; font-weight: 700; }
        .input { width: 100%; padding: 8px 10px; border: 1px solid #E7D3D6; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 12.5px; outline: none; background: #fff; }
        
        .chip-group { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .chip { border: 1px solid #E7D3D6; background: #fff; color: #8B7377; border-radius: 16px; padding: 4px 10px; font-size: 11px; font-family: 'Tajawal', sans-serif; cursor: pointer; }
        .chip.active { background: #6B2737; color: #fff; border-color: #6B2737; }
        
        .saved-colors-box { background: #F3DEE1; border-radius: 10px; padding: 8px; margin-top: 8px; }
        .saved-color-pill { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #D9A9AF; border-radius: 16px; padding: 4px 10px; font-size: 11px; font-weight: 700; color: #6B2737; cursor: pointer; margin: 2px; }

        .color-box { background: #FAF3F0; border: 1px solid #E7D3D6; border-radius: 10px; padding: 10px; margin-top: 8px; }
        .color-header { display: flex; gap: 6px; align-items: center; }
        .color-picker { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #E7D3D6; padding: 0; background: none; flex-shrink: 0; cursor: pointer; }
        
        .size-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; background: #fff; padding: 4px 8px; border-radius: 6px; border: 1px solid #EFDEE0; }
        .size-label { font-size: 11px; font-weight: 700; color: #6B2737; width: 50px; }
        
        .upload-row { display: flex; gap: 6px; margin-top: 6px; }
        .upload-btn { flex: 1; border: 1px dashed #D9BEC3; background: #fff; border-radius: 8px; padding: 6px; font-size: 11px; color: #6B2737; cursor: pointer; font-family: 'Tajawal', sans-serif; text-align: center; }
        .thumb-strip { display: flex; gap: 4px; overflow-x: auto; margin-top: 6px; }
        .thumb-container { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
        .thumb { width: 100%; height: 100%; border-radius: 6px; object-fit: cover; border: 1px solid #E7D3D6; }
        .thumb-remove { position: absolute; top: -4px; left: -4px; background: #C53030; color: #fff; border: none; border-radius: 50%; width: 14px; height: 14px; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .btn { background: #6B2737; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 700; font-family: 'Tajawal', sans-serif; font-size: 13px; cursor: pointer; margin-top: 10px; }
        .btn-outline { background: #fff; color: #6B2737; border: 1px dashed #D9BEC3; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .p-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; position: relative; border: 1px solid #F3DEE1; }
        .p-img { width: 100%; aspect-ratio: 1/1; background: #FBEDEE; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #C9A9AF; font-size: 20px; }
        .p-info { padding: 8px; }
        .p-name { font-size: 12px; font-weight: 800; color: #2B1F22; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
        
        .p-tags { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
        .p-badge-cat { background: #F3DEE1; color: #6B2737; font-size: 9.5px; font-weight: 800; padding: 2px 5px; border-radius: 4px; }
        .p-badge-src { background: #EAE2E4; color: #523F43; font-size: 9.5px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
        
        .p-meta { font-size: 10px; color: #8B7377; display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .swatch-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #fff; display: inline-block; }
        
        .badge { position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 12px; z-index: 2; }
        .badge-out { background: #FDE8E8; color: #C53030; }
        .badge-low { background: #FEFCBF; color: #975A16; }
        .p-edit-btn { position: absolute; top: 6px; left: 6px; background: rgba(255,255,255,0.9); border: 1px solid #E7D3D6; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; z-index: 3; color: #6B2737; }

        .overlay { position: fixed; inset: 0; background: rgba(43,31,34,0.5); display: none; align-items: flex-end; z-index: 50; }
        .overlay.show { display: flex; }
        .sheet { background: #FAF3F0; width: 100%; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 16px; max-height: 85vh; overflow-y: auto; max-width: 480px; margin: 0 auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .sheet-title { font-size: 16px; font-weight: 800; color: #6B2737; }
        .color-picker-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
        .color-pill { border: 1.5px solid transparent; border-radius: 10px; padding: 4px 8px; background: #fff; display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; flex-shrink: 0; }
        .color-pill.active { border-color: #6B2737; background: #FBEDEE; font-weight: 700; }
        .qty-control { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 26px; height: 26px; border-radius: 6px; background: #6B2737; color: #fff; border: none; font-weight: 700; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="./index.html" class="back-btn">← عودة لدفتر الطلبات</a>
        <button class="search-toggle-btn" onclick="toggleSearchSection()">🔍 البحث والفلترة</button>
    </div>

    <div class="header">
        <div class="header-title">
            <h1>كتالوج المنتجات والمخزون</h1>
            <p>إدارة المنتجات والألوان والمقاسات والأوزان</p>
        </div>
    </div>

    <div class="filter-section" id="filterSection">
        <input type="text" id="searchInput" class="input" placeholder="🔍 ابحث بالاسم أو النوع..." oninput="renderList()">
        <div class="filter-row">
            <select id="categoryFilter" class="filter-select" onchange="renderList()">
                <option value="all">الكل (النوع)</option>
                <option value="بجائم">بجائم</option>
                <option value="فساتين">فساتين</option>
                <option value="طقومات">طقومات</option>
                <option value="لانجري">لانجري</option>
                <option value="بنطال/بلوزة">بنطال/بلوزة</option>
                <option value="أخرى">أخرى</option>
            </select>

            <select id="sourceFilter" class="filter-select" onchange="renderList()">
                <option value="all">الكل (المصدر)</option>
                <option value="خارجي">خارجي</option>
                <option value="محلي">محلي</option>
            </select>

            <select id="stockFilter" class="filter-select" onchange="renderList()">
                <option value="all">المخزون</option>
                <option value="available">متوفر</option>
                <option value="low">شارف على النفاد</option>
                <option value="out">نفد</option>
            </select>
        </div>
    </div>

    <div class="add-card-toggle" onclick="toggleAddCard()">
        <span id="addToggleIcon">➕</span> <span id="addToggleText">إضافة منتج جديد للكتالوج</span>
    </div>

    <div class="card" id="addProductCard">
        <div class="card-title" id="formCardTitle">إضافة منتج جديد</div>
        
        <input type="hidden" id="editProductId" value="">

        <div style="display: flex; gap: 8px;">
            <div style="flex:1;">
                <label class="label">نوع المنتج</label>
                <select id="pCategory" class="input">
                    <option value="بجائم">بجائم</option>
                    <option value="فساتين">فساتين</option>
                    <option value="طقومات">طقومات</option>
                    <option value="لانجري">لانجري</option>
                    <option value="بنطال/بلوزة">بنطال/بلوزة</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>
            <div style="flex:1;">
                <label class="label">المصدر</label>
                <select id="pSource" class="input">
                    <option value="خارجي" selected>خارجي</option>
                    <option value="محلي">محلي</option>
                </select>
            </div>
        </div>

        <label class="label">اسم وتفاصيل المنتج</label>
        <input type="text" id="pName" class="input" placeholder="مثال: بجائم نسائي كت / فستان سهرة">

        <div style="display: flex; gap: 8px;">
            <div style="flex:1;">
                <label class="label">من وزن (كغ)</label>
                <input type="number" id="weightFrom" class="input" value="40">
            </div>
            <div style="flex:1;">
                <label class="label">إلى وزن (كغ)</label>
                <input type="number" id="weightTo" class="input" value="65">
            </div>
        </div>

        <label class="label">المقاسات المتاحة لهذا المنتج</label>
        <div class="chip-group" id="sizeChips"></div>
        <div style="display: flex; gap: 6px; margin-top: 6px;">
            <input type="text" id="customSizeInput" class="input" placeholder="أضف مقاساً جديداً (مثل: XXL)" style="flex:1; padding:6px 10px; font-size:11px;">
            <button type="button" class="btn-outline" style="width:auto; padding:6px 12px; font-size:11px; border-radius:8px; margin-top:0;" onclick="addCustomSize()">+ إضافة</button>
        </div>

        <label class="label">إرفاق صور متعددة (كل صورة ستعتبر لوناً جديداً تلقائياً):</label>
        <input type="file" id="bulkImagesInput" accept="image/*" multiple style="display:none" onchange="handleBulkImages(this.files)">
        <button type="button" class="btn" style="background:#8A3A4C; margin-top:4px;" onclick="document.getElementById('bulkImagesInput').click()">📸 رفع صور الألوان دفعة واحدة</button>

        <!-- الألوان المحفوظة مسبقاً -->
        <div id="savedColorsSection" style="margin-top: 10px; display:none;">
            <label class="label">ألوانك المحفوظة السابقة (انقر لإضافة اللون سريعاً):</label>
            <div class="saved-colors-box" id="savedColorsContainer"></div>
        </div>

        <label class="label" style="margin-top:12px;">الألوان والصور والكميات</label>
        <div id="colorsContainer"></div>
        <button class="btn btn-outline" onclick="addColorRow()" style="margin-top:6px;">+ إضافة لون يدوياً</button>

        <button class="btn" onclick="saveProduct()" id="saveBtnText" style="margin-top:14px;">حفظ المنتج بالكتالوج</button>
    </div>

    <div class="grid" id="productsList"></div>

    <div class="overlay" id="detailOverlay" onclick="closeDetail()">
        <div class="sheet" onclick="event.stopPropagation()" id="sheetContent"></div>
    </div>

    <script>
        const DB_NAME = "orderTrackerDB";
        const STORE_NAME = "appdata";
        let ALL_SIZES = ["FREE", "S", "M", "L", "XL", "XXL", "36", "38", "40", "42"];
        let selectedSizes = ["S", "M", "L", "XL"];
        let formColors = [];
        let savedColorsLibrary = []; // قائمة الألوان المحفوظة
        let db;
        let products = [];
        let currentDetailId = null;
        let activeColorId = null;

        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

        function toggleSearchSection() {
            document.getElementById('filterSection').classList.toggle('show');
        }

        function toggleAddCard() {
            const card = document.getElementById('addProductCard');
            const icon = document.getElementById('addToggleIcon');
            const text = document.getElementById('addToggleText');
            card.classList.toggle('show');
            if(card.classList.contains('show')) {
                icon.innerText = "✕";
                text.innerText = "إغلاق نموذج الإضافة";
            } else {
                icon.innerText = "➕";
                text.innerText = "إضافة منتج جديد للكتالوج";
                resetForm();
            }
        }

        function openDB() {
            return new Promise(function(resolve, reject) {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = function(e) {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        d.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e); };
            });
        }

        async function init() {
            try {
                db = await openDB();
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get("products");
                const reqColors = tx.objectStore(STORE_NAME).get("savedColors");
                
                req.onsuccess = function() {
                    products = req.result || [];
                    renderList();
                };
                reqColors.onsuccess = function() {
                    savedColorsLibrary = reqColors.result || [];
                    renderSavedColors();
                };
            } catch(e) {
                products = [];
                savedColorsLibrary = [];
                renderList();
            }
            initForm();
        }

        function persistSavedColors() {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(savedColorsLibrary, "savedColors");
        }

        function addColorToLibrary(name, hex) {
            if(!name || !name.trim()) return;
            const cleanName = name.trim();
            if(!savedColorsLibrary.some(c => c.name.toLowerCase() === cleanName.toLowerCase())) {
                savedColorsLibrary.push({ name: cleanName, hex: hex || "#6B2737" });
                persistSavedColors();
                renderSavedColors();
            }
        }

        function renderSavedColors() {
            const box = document.getElementById('savedColorsSection');
            const container = document.getElementById('savedColorsContainer');
            if(savedColorsLibrary.length === 0) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';
            container.innerHTML = savedColorsLibrary.map(sc => `
                <span class="saved-color-pill" onclick="applySavedColor('${sc.name}', '${sc.hex}')">
                    <span class="swatch-dot" style="background:${sc.hex}; width:12px; height:12px;"></span>
                    ${sc.name}
                </span>
            `).join('');
        }

        function applySavedColor(name, hex) {
            // أضف اللون لأول لون فارغ أو أنشئ صفاً جديداً
            let emptyColor = formColors.find(c => !c.name || c.name.trim() === "");
            if(emptyColor) {
                emptyColor.name = name;
                emptyColor.hex = hex;
            } else {
                const sizesObj = {};
                selectedSizes.forEach(s => sizesObj[s] = 0);
                formColors.push({ id: uid(), name: name, hex: hex, sizes: sizesObj, images: [] });
            }
            renderColorRows();
        }

        function initForm() {
            document.getElementById('editProductId').value = "";
            document.getElementById('formCardTitle').innerText = "إضافة منتج جديد";
            document.getElementById('saveBtnText').innerText = "حفظ المنتج بالكتالوج";
            document.getElementById('pCategory').value = "بجائم";
            document.getElementById('pSource').value = "خارجي";
            document.getElementById('pName').value = "";
            document.getElementById('weightFrom').value = "40";
            document.getElementById('weightTo').value = "65";
            selectedSizes = ["S", "M", "L", "XL"];
            renderSizeChips();
            formColors = [createColorObj()];
            renderColorRows();
            renderSavedColors();
        }

        function resetForm() {
            initForm();
        }

        function createColorObj() {
            const sizesObj = {};
            selectedSizes.forEach(s => sizesObj[s] = 0);
            return { id: uid(), name: "", hex: "#6B2737", sizes: sizesObj, images: [] };
        }

        function renderSizeChips() {
            const wrap = document.getElementById('sizeChips');
            wrap.innerHTML = ALL_SIZES.map(s => `
                <button type="button" class="chip ${selectedSizes.includes(s) ? 'active' : ''}" onclick="toggleSize('${s}')">${s}</button>
            `).join('');
        }

        function toggleSize(s) {
            const idx = selectedSizes.indexOf(s);
            if (idx > -1) {
                if(selectedSizes.length <= 1) { alert('يجب اختيار مقاس واحد على الأقل'); return; }
                selectedSizes.splice(idx, 1);
            } else {
                selectedSizes.push(s);
            }
            
            formColors.forEach(c => {
                if(!c.sizes) c.sizes = {};
                if(idx === -1 && c.sizes[s] === undefined) c.sizes[s] = 0;
            });
            renderSizeChips();
            renderColorRows();
        }

        function addCustomSize() {
            const input = document.getElementById('customSizeInput');
            const val = input.value.trim().toUpperCase();
            if(!val) return;
            if(!ALL_SIZES.includes(val)) ALL_SIZES.push(val);
            if(!selectedSizes.includes(val)) selectedSizes.push(val);
            input.value = "";
            formColors.forEach(c => {
                if(!c.sizes) c.sizes = {};
                if(c.sizes[val] === undefined) c.sizes[val] = 0;
            });
            renderSizeChips();
            renderColorRows();
        }

        function addColorRow() {
            formColors.push(createColorObj());
            renderColorRows();
        }

        function removeColorRow(id) {
            if(formColors.length <= 1) return;
            formColors = formColors.filter(c => c.id !== id);
            renderColorRows();
        }

        function handleBulkImages(files) {
            if(!files || files.length === 0) return;
            Array.from(files).forEach((file, index) => {
                compressImage(file, function(dataUrl) {
                    const sizesObj = {};
                    selectedSizes.forEach(s => sizesObj[s] = 0);
                    // اسم افتراضي مؤقت للون بناءً على رقم الصورة
                    const colorName = `لون ${formColors.length + 1}`;
                    formColors.push({
                        id: uid(),
                        name: colorName,
                        hex: "#6B2737",
                        sizes: sizesObj,
                        images: [dataUrl]
                    });
                    renderColorRows();
                });
            });
        }

        function renderColorRows() {
            const container = document.getElementById('colorsContainer');
            container.innerHTML = formColors.map((c, i) => `
                <div class="color-box">
                    <div class="color-header">
                        <input type="text" class="input" placeholder="اسم اللون (مثل: أحمر)" value="${c.name}" oninput="formColors[${i}].name=this.value; addColorToLibrary(this.value, formColors[${i}].hex);">
                        <input type="color" class="color-picker" value="${c.hex}" onchange="formColors[${i}].hex=this.value; addColorToLibrary(formColors[${i}].name, this.value);">
                        ${formColors.length > 1 ? `<button type="button" onclick="removeColorRow('${c.id}')" style="border:none;background:none;color:#B49AA0;font-size:16px;">✕</button>` : ''}
                    </div>
                    
                    <div style="margin-top:6px;">
                        <span style="font-size:10px; color:#8B7377;">كميات المقاسات لهذا اللون:</span>
                        ${selectedSizes.map(sz => `
                            <div class="size-row">
                                <span class="size-label">${sz}</span>
                                <input type="number" class="input" style="width:60px; padding:2px 4px; text-align:center;" value="${c.sizes[sz] !== undefined ? c.sizes[sz] : 0}" oninput="formColors[${i}].sizes['${sz}']=parseInt(this.value)||0">
                            </div>
                        `).join('')}
                    </div>

                    <input type="file" id="file_${c.id}" accept="image/*" multiple style="display:none" onchange="handleColorImages('${c.id}', this.files)">
                    <div class="upload-row">
                        <button type="button" class="upload-btn" onclick="document.getElementById('file_${c.id}').click()">📷 إضافة صور أخرى لهذا اللون</button>
                    </div>
                    <div class="thumb-strip">
                        ${(c.images || []).map((img, imgIdx) => `
                            <div class="thumb-container">
                                <img src="${img}" class="thumb">
                                <button type="button" class="thumb-remove" onclick="removeColorImage('${c.id}',${imgIdx})">✕</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 600;
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w >= h) { h = Math.round(h*(maxDim/w)); w = maxDim; }
                        else { w = Math.round(w*(maxDim/h)); h = maxDim; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.65));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleColorImages(colorId, files) {
            const c = formColors.find(x => x.id === colorId);
            if (!c) return;
            Array.from(files).forEach(file => {
                compressImage(file, function(dataUrl) {
                    if (!c.images) c.images = [];
                    c.images.push(dataUrl);
                    renderColorRows();
                });
            });
        }

        function removeColorImage(colorId, imgIdx) {
            const c = formColors.find(x => x.id === colorId);
            if (!c || !c.images) return;
            c.images.splice(imgIdx, 1);
            renderColorRows();
        }

        function saveProduct() {
            const editId = document.getElementById('editProductId').value;
            const category = document.getElementById('pCategory').value;
            const name = document.getElementById('pName').value.trim();
            const source = document.getElementById('pSource').value;
            const weightFrom = document.getElementById('weightFrom').value || "40";
            const weightTo = document.getElementById('weightTo').value || "65";

            if(!name) { alert('يرجى كتابة اسم المنتج'); return; }

            const validColors = formColors.filter(c => c.name.trim() !== "");
            if(validColors.length === 0) { alert('يرجى إضافة لون واحد على الأقل مع اسمه'); return; }

            // حفظ الألوان في المكتبة تلقائياً للاستخدام المستقبلي
            validColors.forEach(c => addColorToLibrary(c.name, c.hex));

            const productData = {
                id: editId ? editId : uid(),
                category: category || "عام",
                name,
                source,
                weightFrom,
                weightTo,
                colors: validColors
            };

            if(editId) {
                const idx = products.findIndex(p => p.id === editId);
                if(idx > -1) products[idx] = productData;
            } else {
                products.unshift(productData);
            }

            persistAndRefresh();
            toggleAddCard();
            initForm();
        }

        function persistAndRefresh() {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(products, "products");
            tx.oncomplete = function() {
                renderList();
                if(currentDetailId) openDetail(currentDetailId);
            };
        }

        function totalStock(p) {
            if(!p.colors) return 0;
            return p.colors.reduce((sum, c) => {
                const sizesTotal = Object.values(c.sizes || {}).reduce((a,b) => a+b, 0);
                return sum + sizesTotal;
            }, 0);
        }

        function getStockStatus(p) {
            const stock = totalStock(p);
            if(stock === 0) return 'out';
            if(stock <= 3) return 'low';
            return 'available';
        }

        function renderList() {
            const list = document.getElementById('productsList');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const categoryVal = document.getElementById('categoryFilter').value;
            const sourceVal = document.getElementById('sourceFilter').value;
            const stockVal = document.getElementById('stockFilter').value;

            const filtered = products.filter(p => {
                const cat = p.category || "";
                const nameStr = (p.name + " " + cat).toLowerCase();
                if(searchVal && !nameStr.includes(searchVal)) return false;
                if(categoryVal !== 'all' && cat !== categoryVal) return false;
                if(sourceVal !== 'all' && p.source !== sourceVal) return false;
                if(stockVal !== 'all' && getStockStatus(p) !== stockVal) return false;
                return true;
            });

            if(filtered.length === 0) {
                list.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#8B7377; padding:20px; font-size:12px;">لا توجد منتجات مطابقة للبحث</div>';
                return;
            }
            
            list.innerHTML = filtered.map(p => {
                const coverImg = p.colors && p.colors[0] && p.colors[0].images && p.colors[0].images[0];
                const status = getStockStatus(p);
                let badgeHTML = '';
                if(status === 'out') badgeHTML = '<span class="badge badge-out">نفد</span>';
                else if(status === 'low') badgeHTML = '<span class="badge badge-low">قليل</span>';

                return `
                    <div class="p-card" onclick="openDetail('${p.id}')">
                        ${coverImg ? `<img src="${coverImg}" class="p-img">` : `<div class="p-img">📷</div>`}
                        ${badgeHTML}
                        <button class="p-edit-btn" onclick="event.stopPropagation(); editProduct('${p.id}')" title="تعديل المنتج">✏️</button>
                        <div class="p-info">
                            <div class="p-name">${p.name}</div>
                            <div class="p-tags">
                                <span class="p-badge-cat">${p.category || 'عام'}</span>
                                <span class="p-badge-src">${p.source}</span>
                            </div>
                            <div style="font-size:9.5px; color:#6B2737; margin-bottom:2px;">⚖️ من ${p.weightFrom || 40} إلى ${p.weightTo || 65} كغ</div>
                            <div class="p-meta">
                                <span>متوفر: ${totalStock(p)}</span>
                                <div>
                                    ${(p.colors || []).map(c => `<span class="swatch-dot" style="background:${c.hex}"></span>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editProduct(id) {
            const p = products.find(x => x.id === id);
            if(!p) return;
            
            document.getElementById('editProductId').value = p.id;
            document.getElementById('formCardTitle').innerText = "تعديل بيانات المنتج";
            document.getElementById('saveBtnText').innerText = "تحديث المنتج";
            document.getElementById('pCategory').value = p.category || "بجائم";
            document.getElementById('pSource').value = p.source || "خارجي";
            document.getElementById('pName').value = p.name || "";
            document.getElementById('weightFrom').value = p.weightFrom || "40";
            document.getElementById('weightTo').value = p.weightTo || "65";

            selectedSizes = [];
            (p.colors || []).forEach(c => {
                if(c.sizes) {
                    Object.keys(c.sizes).forEach(sz => {
                        if(!selectedSizes.includes(sz)) selectedSizes.push(sz);
                        if(!ALL_SIZES.includes(sz)) ALL_SIZES.push(sz);
                    });
                }
            });
            if(selectedSizes.length === 0) selectedSizes = ["S", "M", "L", "XL"];

            renderSizeChips();
            formColors = JSON.parse(JSON.stringify(p.colors || []));
            if(formColors.length === 0) formColors = [createColorObj()];
            renderColorRows();

            const card = document.getElementById('addProductCard');
            if(!card.classList.contains('show')) {
                toggleAddCard();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openDetail(id) {
            currentDetailId = id;
            const p = products.find(x => x.id === id);
            if(!p) return;
            if(!activeColorId || !p.colors.some(c => c.id === activeColorId)) {
                activeColorId = p.colors[0] ? p.colors[0].id : null;
            }
            renderDetailSheet();
            document.getElementById('detailOverlay').classList.add('show');
        }

        function closeDetail() {
            document.getElementById('detailOverlay').classList.remove('show');
            currentDetailId = null;
        }

        function renderDetailSheet() {
            const p = products.find(x => x.id === currentDetailId);
            if(!p) return;
            const color = p.colors.find(c => c.id === activeColorId) || p.colors[0];
            const imgs = (color && color.images && color.images.length > 0) ? color.images : [];

            const sheet = document.getElementById('sheetContent');
            sheet.innerHTML = `
                <div class="sheet-header">
                    <div>
                        <div class="sheet-title">${p.name}</div>
                        <div class="p-tags" style="margin-top:3px;">
                            <span class="p-badge-cat">${p.category || 'عام'}</span>
                            <span class="p-badge-src">${p.source}</span>
                            <span class="p-badge-src" style="background:#FAF3F0; border:1px solid #E7D3D6;">⚖️ ${p.weightFrom || 40}-${p.weightTo || 65} كغ</span>
                        </div>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="closeDetail(); editProduct('${p.id}')" style="background:none;border:none;cursor:pointer;font-size:16px;" title="تعديل">✏️</button>
                        <button onclick="deleteProduct('${p.id}')" style="background:none;border:none;cursor:pointer;font-size:16px;" title="حذف">🗑️</button>
                    </div>
                </div>
                
                ${imgs.length > 0 ? `
                    <div style="display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:4px;">
                        ${imgs.map(img => `<img src="${img}" style="width:140px; height:180px; border-radius:12px; object-fit:cover; background:#FBEDEE; flex-shrink:0; border:1px solid #E7D3D6;">`).join('')}
                    </div>
                ` : `<div style="text-align:center; padding:20px; color:#C9A9AF; font-size:12px; background:#FBEDEE; border-radius:12px; margin-bottom:10px;">📷 لا توجد صور لهذا اللون</div>`}
                
                <div style="font-size:11px; color:#8B7377; margin-bottom:8px;">إجمالي المخزون المتبقي: <b>${totalStock(p)} قطعة</b></div>

                <label class="label">الألوان المتاحة:</label>
                <div class="color-picker-row">
                    ${p.colors.map(c => `
                        <div class="color-pill ${c.id === color.id ? 'active' : ''}" onclick="activeColorId='${c.id}'; renderDetailSheet();">
                            <span class="swatch-dot" style="background:${c.hex}"></span>
                            <span>${c.name}</span>
                        </div>
                    `).join('')}
                </div>

                ${color ? `
                    <label class="label">مقاسات وكميات لون (${color.name}):</label>${Object.keys(color.sizes || {}).length === 0 ? '<div style="font-size:11px; color:#8B7377;">لا توجد مقاسات محددة</div>' : 
                    Object.keys(color.sizes).map(sz => `
                        <div class="size-row">
                            <span class="size-label" style="font-weight:800;">${sz}</span>
                            <span style="font-size:12px; font-weight:700;">متوفر: ${color.sizes[sz]}</span>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="adjustQty('${p.id}', '${color.id}', '${sz}', -1)">−</button>
                                <span style="font-weight:800; min-width:18px; text-align:center; font-size:12px;">${color.sizes[sz]}</span>
                                <button class="qty-btn" onclick="adjustQty('${p.id}', '${color.id}', '${sz}', 1)">+</button>
                            </div>
                        </div>
                    `).join('')}
                ` : ''}
            `;
        }

        function adjustQty(pId, cId, size, delta) {
            const p = products.find(x => x.id === pId);
            if(!p) return;
            const c = p.colors.find(x => x.id === cId);
            if(!c || !c.sizes) return;
            
            const current = c.sizes[size] || 0;
            c.sizes[size] = Math.max(0, current + delta);
            persistAndRefresh();
        }

        function deleteProduct(id) {
            if(!confirm('هل تريد حذف هذا المنتج نهائياً؟')) return;
            products = products.filter(x => x.id !== id);
            closeDetail();
            persistAndRefresh();
        }

        init();
    </script>
</body>
</html>
