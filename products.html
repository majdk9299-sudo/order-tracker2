<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>كتالوج المنتجات</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6B2737">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كتالوج المنتجات">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; background: #FAF3F0; font-family: 'Tajawal', sans-serif; color: #2B1F22; padding-bottom: 100px; }
.header { background: linear-gradient(135deg, #6B2737 0%, #8A3A4C 100%); padding: 28px 20px 22px; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; }
.header-top { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 42px; height: 42px; border-radius: 14px; background: rgba(250,243,240,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #FAF3F0; font-size: 20px; text-decoration:none; }
.header-title { font-family: 'Amiri', serif; font-size: 28px; font-weight: 700; color: #FAF3F0; line-height: 1.2; }
.header-sub { font-size: 13px; color: #E8CDD3; margin-top: 2px; }
.stats-row { display: flex; gap: 10px; margin-top: 20px; }
.stat-tag { flex: 1; background: rgba(250,243,240,0.9); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stat-num { font-size: 20px; font-weight: 800; color: #6B2737; }
.stat-label { font-size: 11px; color: #8B7377; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-row { display: flex; gap: 8px; padding: 18px 20px 0; align-items: center; flex-wrap: wrap; }
.filter-btn { border: 1px solid #E7D3D6; background: #fff; color: #8B7377; border-radius: 999px; padding: 7px 16px; font-size: 13px; font-family: 'Tajawal', sans-serif; cursor: pointer; }
.filter-btn.active { background: #6B2737; color: #FAF3F0; border-color: #6B2737; }
.filter-icon-btn { margin-right: auto; position: relative; border: 1px solid #E7D3D6; background: #fff; color: #8B7377; border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.filter-icon-btn.active { background: #F3DEE1; border-color: #D9A9AF; color: #6B2737; }
.more-filters { display: none; gap: 8px; padding: 10px 20px 0; flex-wrap: wrap; }
.more-filters.show { display: flex; }
.filter-field { flex: 1 1 100px; }
.filter-label { display: block; font-size: 11px; color: #8B7377; margin-bottom: 4px; }
.filter-select { width: 100%; border: 1px solid #E7D3D6; background: #fff; border-radius: 10px; padding: 7px 8px; font-size: 12.5px; font-family: 'Tajawal', sans-serif; color: #2B1F22; }
.search-wrap { padding: 18px 20px 0; }
.grid { padding: 16px 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.product-card { background: #fff; border-radius: 18px; box-shadow: 0 2px 10px rgba(107,39,55,0.06); overflow: hidden; cursor: pointer; }
.product-cover { position: relative; width: 100%; aspect-ratio: 3/4; background: #FBEDEE; display: flex; align-items: center; justify-content: center; color: #C9A9AF; font-size: 26px; }
.product-cover img { width: 100%; height: 100%; object-fit: cover; }
.product-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 3px 9px; }
.badge-out { background: #FBE4E4; color: #9A3B3B; }
.badge-low { background: #FDF0D8; color: #8A6A1F; }
.product-swatches { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 3px; }
.product-swatch { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.7); }
.product-info { padding: 10px 12px; }
.product-name { font-size: 13px; font-weight: 700; color: #2B1F22; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.product-meta { font-size: 11px; color: #8B7377; margin-top: 2px; }
.empty-state { text-align: center; padding: 50px 20px; color: #B49AA0; }
.fab { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #6B2737; border: none; box-shadow: 0 8px 20px rgba(107,39,55,0.35); display: flex; align-items: center; gap: 8px; cursor: pointer; color: #FAF3F0; font-size: 14px; font-weight: 700; font-family: 'Tajawal', sans-serif; border-radius: 999px; padding: 14px 22px; z-index: 40; }
.sheet-overlay { position: fixed; inset: 0; background: rgba(43,31,34,0.4); display: none; align-items: flex-end; z-index: 50; }
.sheet-overlay.show { display: flex; }
.sheet { background: #FAF3F0; width: 100%; border-top-left-radius: 26px; border-top-right-radius: 26px; padding: 18px 20px 26px; max-width: 480px; margin: 0 auto; max-height: 90vh; overflow-y: auto; }
.sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-title { font-family: 'Amiri', serif; font-size: 20px; font-weight: 700; color: #6B2737; }
.label { display: block; font-size: 12px; color: #8B7377; margin-bottom: 5px; margin-top: 10px; }
.input { width: 100%; border: 1px solid #E7D3D6; background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-family: 'Tajawal', sans-serif; color: #2B1F22; outline: none; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.chip-btn { border: 1px solid #E7D3D6; background: #fff; color: #8B7377; border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-family: 'Tajawal', sans-serif; cursor: pointer; }
.chip-btn.active { background: #6B2737; color: #FAF3F0; border-color: #6B2737; }
.color-card { background: #fff; border: 1px solid #E7D3D6; border-radius: 14px; padding: 12px; margin-top: 10px; }
.color-row-top { display: flex; gap: 8px; align-items: center; }
.color-swatch-input { width: 38px; height: 38px; border-radius: 10px; border: 1px solid #E7D3D6; padding: 0; background: none; flex-shrink: 0; }
.upload-row { display: flex; gap: 8px; margin-top: 10px; }
.upload-btn { flex: 1; border: 1.5px dashed #D9BEC3; background: #fff; border-radius: 12px; padding: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; color: #6B2737; cursor: pointer; font-family: 'Tajawal', sans-serif; }
.form-images-row { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
.form-thumb { position: relative; width: 54px; height: 54px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
.form-thumb img { width: 100%; height: 100%; object-fit: cover; }
.form-thumb .remove-x { position: absolute; top: 2px; left: 2px; background: rgba(43,31,34,0.65); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.remove-color-btn { margin-right: auto; background: none; border: none; color: #B49AA0; font-size: 16px; cursor: pointer; }
.add-color-btn { width: 100%; margin-top: 10px; border: 1px dashed #D9BEC3; background: #fff; border-radius: 12px; padding: 10px; font-size: 13px; color: #6B2737; cursor: pointer; font-family: 'Tajawal', sans-serif; }
.submit-btn { width: 100%; margin-top: 20px; background: #6B2737; color: #FAF3F0; border: none; border-radius: 14px; padding: 13px 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Tajawal', sans-serif; }
.qty-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; justify-content: space-between; }
.qty-controls { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 26px; height: 26px; border-radius: 8px; background: #F3DEE1; color: #6B2737; border: none; font-size: 15px; font-weight: 700; cursor: pointer; display:flex; align-items:center; justify-content:center; }
.qty-val { min-width: 20px; text-align: center; font-weight: 800; color: #2B1F22; }
.detail-gallery { position: relative; width: 100%; aspect-ratio: 4/5; background: #FBEDEE; }
.detail-gallery img { width: 100%; height: 100%; object-fit: cover; }
.gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.7); border: none; color: #6B2737; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.gallery-nav.prev { right: 10px; }
.gallery-nav.next { left: 10px; }
.gallery-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
.gallery-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.5); }
.gallery-dot.active { background: #fff; }
.tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.meta-tag { display: inline-flex; align-items: center; gap: 4px; background: #F5EFEC; color: #7A6A5E; border-radius: 8px; padding: 4px 10px; font-size: 12px; }
.color-list-item { display: flex; align-items: center; justify-content: space-between; border: 1px solid #E7D3D6; border-radius: 12px; padding: 10px 12px; margin-top: 8px; cursor: pointer; }
.color-list-item.active { border-color: #6B2737; background: #FBEDEE; }
.color-list-item.out { background: #FBE4E4; border-color: #F0B8B8; }
.color-list-item.low { background: #FDF0D8; border-color: #E9CE9A; }
.color-name-wrap { display: flex; align-items: center; gap: 8px; }
.color-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
.icon-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const DB_NAME = "orderTrackerDB";
const DB_VERSION = 2;
const STORE_NAME = "appdata";
let db;
let products = [];

function openDB() {
  return new Promise(function(resolve, reject) {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e) {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) {
        d.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e); };
  });
}
function loadProducts() {
  return new Promise(function(resolve) {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get("products");
    req.onsuccess = function() { resolve(req.result || []); };
    req.onerror = function() { resolve([]); };
  });
}
function persistProducts() {
  if (!db) return;
  const tx = db.transaction(STORE_NAME, "readwrite");
  tx.objectStore(STORE_NAME).put(products, "products");
}
async function initApp() {
  try {
    db = await openDB();
    products = await loadProducts();
  } catch (e) { products = []; }
  render();
}

const SOURCES = [{id:"local",label:"محلي"},{id:"china",label:"صيني"},{id:"shein",label:"شي إن"}];
const SIZE_OPTIONS = ["XS","S","M","L","XL","XXL"];

let search = "";
let sourceFilter = "all";
let stockFilter = "all";
let showFilters = false;
let showForm = false;
let detailId = null;
let detailColorId = null;
let detailImgIdx = 0;

// form state
let fName = "", fSource = "local", fThreshold = "3", fSizes = [];
let fColors = [];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function save() { persistProducts(); render(); }

function newColorRow() {
  return { id: uid(), name: "", hex: "#7CC9A9", qty: "", images: [] };
}
function openForm() {
  fName = ""; fSource = "local"; fThreshold = "3"; fSizes = [];
  fColors = [newColorRow()];
  showForm = true; render();
}
function closeForm() { showForm = false; render(); }
function toggleFSize(s) {
  const i = fSizes.indexOf(s);
  if (i === -1) fSizes.push(s); else fSizes.splice(i,1);
  render();
}
function addColorRow() { fColors.push(newColorRow()); render(); }
function removeColorRow(id) { fColors = fColors.filter(function(c){return c.id!==id;}); render(); }
function updateColorField(id, field, val) {
  fColors = fColors.map(function(c){ return c.id===id ? Object.assign({}, c, {[field]: val}) : c; });
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const maxDim = 700;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h*(maxDim/w)); w = maxDim; }
        else { w = Math.round(w*(maxDim/h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      let dataUrl;
      try { dataUrl = canvas.toDataURL('image/jpeg', 0.72); }
      catch(err) { dataUrl = e.target.result; }
      callback(dataUrl);
    };
    img.onerror = function(){ callback(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleColorImages(colorId, files) {
  Array.from(files).forEach(function(file) {
    compressImage(file, function(dataUrl) {
      fColors = fColors.map(function(c) {
        if (c.id !== colorId) return c;
        const imgs = (c.images || []).slice();
        if (imgs.length < 4) imgs.push(dataUrl);
        return Object.assign({}, c, { images: imgs });
      });
      render();
    });
  });
}
function removeColorImage(colorId, idx) {
  fColors = fColors.map(function(c) {
    if (c.id !== colorId) return c;
    const imgs = (c.images||[]).slice();
    imgs.splice(idx,1);
    return Object.assign({}, c, { images: imgs });
  });
  render();
}
function canSaveForm() {
  return fName.trim() && fColors.some(function(c){ return c.name.trim() && c.qty !== ""; });
}
function submitForm() {
  if (!canSaveForm()) return;
  const cleanColors = fColors.filter(function(c){ return c.name.trim() && c.qty !== ""; })
    .map(function(c){ return Object.assign({}, c, { qty: parseInt(c.qty)||0 }); });
  products.unshift({
    id: uid(), name: fName.trim(), source: fSource,
    threshold: parseInt(fThreshold)||3, sizes: fSizes.slice(),
    colors: cleanColors
  });
  showForm = false;
  save();
}
function removeProduct(id) {
  if (!confirm('حذف هذا المنتج نهائياً؟')) return;
  products = products.filter(function(p){ return p.id !== id; });
  detailId = null;
  save();
}
function adjustQty(productId, colorId, delta) {
  products = products.map(function(p) {
    if (p.id !== productId) return p;
    return Object.assign({}, p, { colors: p.colors.map(function(c) {
      return c.id === colorId ? Object.assign({}, c, { qty: Math.max(0, c.qty + delta) }) : c;
    })});
  });
  save();
}
function openDetail(id) {
  detailId = id;
  const p = products.find(function(x){return x.id===id;});
  detailColorId = p && p.colors[0] ? p.colors[0].id : null;
  detailImgIdx = 0;
  render();
}
function closeDetail() { detailId = null; render(); }
function selectDetailColor(cid) { detailColorId = cid; detailImgIdx = 0; render(); }
function galleryNav(delta, images) {
  detailImgIdx = (detailImgIdx + delta + images.length) % images.length;
  render();
}

function productStock(p) { return p.colors.reduce(function(s,c){return s+c.qty;},0); }
function stockStatus(p) {
  const total = productStock(p);
  if (total === 0) return "out";
  const anyLow = p.colors.some(function(c){ return c.qty>0 && c.qty<=(p.threshold||3); });
  const anyOut = p.colors.some(function(c){ return c.qty===0; });
  if (anyLow || anyOut) return "low";
  return "ok";
}

function render() {
  const filtered = products.filter(function(p) {
    if (search.trim() && p.name.toLowerCase().indexOf(search.trim().toLowerCase()) === -1) return false;
    if (sourceFilter !== "all" && p.source !== sourceFilter) return false;
    if (stockFilter !== "all") {
      const st = stockStatus(p);
      if (stockFilter === "out" && st !== "out") return false;
      if (stockFilter === "low" && st !== "low") return false;
      if (stockFilter === "available" && st === "out") return false;
    }
    return true;
  });

  const totalPieces = products.reduce(function(s,p){return s+productStock(p);},0);
  const lowCount = products.filter(function(p){return stockStatus(p)==="low";}).length;
  const outCount = products.filter(function(p){return stockStatus(p)==="out";}).length;
  const activeFilterCount = (sourceFilter!=="all"?1:0) + (stockFilter!=="all"?1:0);

  let html = `
  <div class="header">
    <div class="header-top">
      <a class="brand-mark" href="./index.html" title="الرجوع لدفتر الطلبات">←</a>
      <div style="flex:1;">
        <div class="header-title">كتالوج المنتجات</div>
        <div class="header-sub">الصور والألوان والمقاسات والكمية بمكان واحد</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-tag"><span class="stat-num">${products.length}</span><span class="stat-label">منتج</span></div>
      <div class="stat-tag" style="background:#FDF0D8;"><span class="stat-num" style="color:#8A6A1F;">${lowCount}</span><span class="stat-label" style="color:#8A6A1F;">شارف على النفاد</span></div>
      <div class="stat-tag" style="background:#FBE4E4;"><span class="stat-num" style="color:#9A3B3B;">${outCount}</span><span class="stat-label" style="color:#9A3B3B;">نفد</span></div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" class="input" style="border-radius:14px;" placeholder="🔍 ابحثي عن منتج..." value="${search}" oninput="search=this.value; render();">
  </div>

  <div class="filter-row">
    <button class="filter-icon-btn ${activeFilterCount>0?'active':''}" onclick="showFilters=!showFilters; render();">⚙️ فلترة ${activeFilterCount>0?('('+activeFilterCount+')'):''}</button>
  </div>
  <div class="more-filters ${showFilters?'show':''}">
    <div class="filter-field">
      <label class="filter-label">المصدر</label>
      <select class="filter-select" onchange="sourceFilter=this.value; render();">
        <option value="all" ${sourceFilter==='all'?'selected':''}>الكل</option>
        ${SOURCES.map(function(s){return `<option value="${s.id}" ${sourceFilter===s.id?'selected':''}>${s.label}</option>`;}).join('')}
      </select>
    </div>
    <div class="filter-field">
      <label class="filter-label">حالة المخزون</label>
      <select class="filter-select" onchange="stockFilter=this.value; render();">
        <option value="all" ${stockFilter==='all'?'selected':''}>الكل</option>
        <option value="available" ${stockFilter==='available'?'selected':''}>متوفر</option>
        <option value="low" ${stockFilter==='low'?'selected':''}>شارف على النفاد</option>
        <option value="out" ${stockFilter==='out'?'selected':''}>نفد</option>
      </select>
    </div>
  </div>

  <div class="grid">
    ${filtered.length===0 ? `<div class="empty-state" style="grid-column:1/-1;">${products.length===0?'ما فيه منتجات بعد — أضيفي أول منتج':'ما فيه نتائج مطابقة'}</div>` :
    filtered.map(function(p) {
      const status = stockStatus(p);
      const coverColor = p.colors.find(function(c){return c.images && c.images.length;});
      const cover = coverColor ? coverColor.images[0] : null;
      return `
      <div class="product-card" onclick="openDetail('${p.id}')">
        <div class="product-cover">
          ${cover ? `<img src="${cover}">` : '📷'}
          ${status!=='ok' ? `<span class="product-badge ${status==='out'?'badge-out':'badge-low'}">${status==='out'?'نفد':'شارف'}</span>` : ''}
          <div class="product-swatches">
            ${p.colors.slice(0,4).map(function(c){return `<span class="product-swatch" style="background:${c.hex||'#7CC9A9'}"></span>`;}).join('')}
          </div>
        </div>
        <div class="product-info">
        <div class="product-name">${p.name}</div>
          <div class="product-meta">${(SOURCES.find(function(s){return s.id===p.source;})||{}).label||''} · ${productStock(p)} قطعة</div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <button class="fab" onclick="openForm()">+ منتج جديد</button>

  <div class="sheet-overlay ${showForm?'show':''}" onclick="closeForm()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <div class="sheet-title">منتج جديد</div>
        <button class="icon-btn" onclick="closeForm()">✕</button>
      </div>

      <label class="label">اسم المنتج</label>
      <input class="input" value="${fName}" oninput="fName=this.value" placeholder="مثال: فستان طويل">

      <label class="label">المصدر</label>
      <div class="chip-row">
        ${SOURCES.map(function(s){return `<button type="button" class="chip-btn ${fSource===s.id?'active':''}" onclick="fSource='${s.id}'; render();">${s.label}</button>`;}).join('')}
      </div>

      <label class="label">المقاسات المتوفرة (اختياري)</label>
      <div class="chip-row">
        ${SIZE_OPTIONS.map(function(s){return `<button type="button" class="chip-btn ${fSizes.indexOf(s)>-1?'active':''}" onclick="toggleFSize('${s}')">${s}</button>`;}).join('')}
      </div>

      <label class="label">تنبيه عند وصول الكمية إلى</label>
      <input class="input" style="width:80px;" type="number" value="${fThreshold}" oninput="fThreshold=this.value">

      <label class="label">الألوان والصور</label>
      ${fColors.map(function(c) {
        return `
        <div class="color-card">
          <div class="color-row-top">
            <input class="input" style="flex:1;" placeholder="اسم اللون" value="${c.name}" oninput="updateColorField('${c.id}','name',this.value)">
            <input class="color-swatch-input" type="color" value="${c.hex}" onchange="updateColorField('${c.id}','hex',this.value)">
            <input class="input" style="width:70px;" type="number" placeholder="الكمية" value="${c.qty}" oninput="updateColorField('${c.id}','qty',this.value)">
            ${fColors.length>1 ? `<button class="remove-color-btn" onclick="removeColorRow('${c.id}')">✕</button>` : ''}
          </div>
          <input type="file" id="camera_${c.id}" accept="image/*" capture="environment" style="display:none" onchange="handleColorImages('${c.id}', this.files); this.value='';">
          <input type="file" id="gallery_${c.id}" accept="image/*" multiple style="display:none" onchange="handleColorImages('${c.id}', this.files); this.value='';">
          <div class="upload-row">
            <button type="button" class="upload-btn" onclick="document.getElementById('camera_${c.id}').click()">📷 تصوير</button>
            <button type="button" class="upload-btn" onclick="document.getElementById('gallery_${c.id}').click()">🖼️ من المعرض</button>
          </div>
          ${(c.images&&c.images.length) ? `
          <div class="form-images-row">
            ${c.images.map(function(img,idx){return `<div class="form-thumb"><img src="${img}"><button class="remove-x" onclick="removeColorImage('${c.id}',${idx})">✕</button></div>`;}).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
      <button type="button" class="add-color-btn" onclick="addColorRow()">+ لون آخر</button>

      <button class="submit-btn" ${canSaveForm()?'':'disabled style="opacity:0.5;"'} onclick="submitForm()">حفظ المنتج</button>
    </div>
  </div>
  `;

  const detailProduct = products.find(function(p){return p.id===detailId;});
  if (detailProduct) {
    const color = detailProduct.colors.find(function(c){return c.id===detailColorId;}) || detailProduct.colors[0];
    const images = (color && color.images) || [];
    html += `
    <div class="sheet-overlay show" onclick="closeDetail()">
      <div class="sheet" style="padding:0; overflow:hidden;" onclick="event.stopPropagation()">
        <div class="sheet-header" style="padding:14px 20px 0;">
          <div class="sheet-title" style="font-size:17px;">${detailProduct.name}</div>
          <div style="display:flex; gap:14px; align-items:center;">
            <button class="icon-btn" onclick="removeProduct('${detailProduct.id}')">🗑️</button>
            <button class="icon-btn" onclick="closeDetail()">✕</button>
          </div>
        </div>
        <div class="detail-gallery">
          ${images.length ? `<img src="${images[detailImgIdx]}">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#C9A9AF;font-size:30px;">📷</div>'}
          ${images.length>1 ? `
            <button class="gallery-nav prev" onclick="galleryNav(1, ${JSON.stringify(images).replace(/"/g,'&quot;')})">›</button>
            <button class="gallery-nav next" onclick="galleryNav(-1, ${JSON.stringify(images).replace(/"/g,'&quot;')})">‹</button>
            <div class="gallery-dots">${images.map(function(_,i){return `<span class="gallery-dot ${i===detailImgIdx?'active':''}"></span>`;}).join('')}</div>
          ` : ''}
        </div>
        <div style="padding:14px 20px 20px;">
          <div class="tags-row">
            <span class="meta-tag">${(SOURCES.find(function(s){return s.id===detailProduct.source;})||{}).label||''}</span>
            ${detailProduct.sizes && detailProduct.sizes.length ? `<span class="meta-tag">مقاسات: ${detailProduct.sizes.join(' / ')}</span>` : ''}
          </div>
          <label class="label" style="margin-top:2px;">الألوان</label>
          ${detailProduct.colors.map(function(c) {
            const isOut = c.qty===0, isLow = c.qty>0 && c.qty<=(detailProduct.threshold||3);
            const cls = c.id===(color&&color.id) ? 'active' : (isOut?'out':(isLow?'low':''));
            return `
            <div class="color-list-item ${cls}" onclick="selectDetailColor('${c.id}')">
              <div class="color-name-wrap">
                <span class="color-dot" style="background:${c.hex||'#7CC9A9'}"></span>
                <span>${c.name}</span>
                ${isOut?'⚠️':(isLow?'⚠️':'')}
              </div>
              <div class="qty-controls" onclick="event.stopPropagation()">
                <button class="qty-btn" onclick="adjustQty('${detailProduct.id}','${c.id}',-1)">−</button>
                <span class="qty-val">${c.qty}</span>
                <button class="qty-btn" onclick="adjustQty('${detailProduct.id}','${c.id}',1)">+</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }

  document.getElementById('app').innerHTML = html;
}

initApp();
</script>
</body>
</html>
