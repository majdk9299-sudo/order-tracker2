<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>دفتر الطلبات</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6B2737">
    <link rel="icon" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="دفتر الطلبات">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: #FAF3F0; font-family: 'Tajawal', sans-serif; color: #2B1F22; padding-bottom: 100px; }
        .header { background: linear-gradient(135deg, #6B2737 0%, #8A3A4C 100%); padding: 28px 20px 22px; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; }
        .header-top { display: flex; align-items: center; gap: 12px; }
        .brand-mark { width: 42px; height: 42px; border-radius: 14px; background: rgba(250,243,240,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #FAF3F0; font-size: 20px; }
        .header-title { font-family: 'Amiri', serif; font-size: 28px; font-weight: 700; color: #FAF3F0; line-height: 1.2; }
        .header-sub { font-size: 13px; color: #E8CDD3; margin-top: 2px; }
        .stats-row { display: flex; gap: 10px; margin-top: 20px; }
        .stat-tag { flex: 1; background: rgba(250,243,240,0.9); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .stat-num { font-size: 20px; font-weight: 800; color: #6B2737; }
        .stat-label { font-size: 11px; color: #8B7377; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .filter-row { display: flex; gap: 8px; padding: 18px 20px 0; align-items: center; }
        .filter-btn { border: 1px solid #E7D3D6; background: #fff; color: #8B7377; border-radius: 999px; padding: 7px 16px; font-size: 13px; font-family: 'Tajawal', sans-serif; cursor: pointer; }
        .filter-btn.active { background: #6B2737; color: #FAF3F0; border-color: #6B2737; }
        .filter-icon-btn { margin-right: auto; position: relative; border: 1px solid #E7D3D6; background: #fff; color: #8B7377; border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .filter-icon-btn.active { background: #F3DEE1; border-color: #D9A9AF; color: #6B2737; }
        .more-filters { display: none; gap: 8px; padding: 10px 20px 0; flex-wrap: wrap; }
        .more-filters.show { display: flex; }
        .filter-field { flex: 1 1 100px; }
        .filter-label { display: block; font-size: 11px; color: #8B7377; margin-bottom: 4px; }
        .filter-select { width: 100%; border: 1px solid #E7D3D6; background: #fff; border-radius: 10px; padding: 7px 8px; font-size: 12.5px; font-family: 'Tajawal', sans-serif; color: #2B1F22; }
        .list { padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px; }
        .customer-card { background: #fff; border-radius: 18px; box-shadow: 0 2px 10px rgba(107,39,55,0.06); overflow: hidden; }
        .customer-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
        .customer-avatar { width: 38px; height: 38px; border-radius: 50%; background: #F3DEE1; color: #6B2737; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }
        .customer-name { font-size: 15.5px; font-weight: 700; color: #2B1F22; }
        .customer-meta { font-size: 12px; color: #8B7377; margin-top: 1px; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
        .add-item-btn { background: #FBEDEE; border-radius: 10px; width: 30px; height: 30px; }
        .items-wrap { border-top: 1px dashed #EFDEE0; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
        .item-row { display: flex; align-items: flex-start; gap: 10px; }
        .card-image-wrap { width: 54px; height: 54px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: #FBEDEE; display: flex; align-items: center; justify-content: center; color: #C9A9AF; }
        .card-image { width: 100%; height: 100%; object-fit: cover; }
        .card-size { font-size: 12.5px; color: #8B7377; margin-bottom: 5px; }
        .tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .meta-tag { display: inline-flex; align-items: center; gap: 4px; background: #F5EFEC; color: #7A6A5E; border-radius: 8px; padding: 3px 8px; font-size: 11px; }
        .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .status-tag { display: inline-flex; align-items: center; gap: 5px; border: none; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-family: 'Tajawal', sans-serif; font-weight: 700; cursor: pointer; }
        .preparing { background: #FDF0D8; color: #8A6A1F; }
        .delivered { background: #E4F1E6; color: #2E6B3E; }
        .paid { background: #E4F1E6; color: #2E6B3E; }
        .unpaid { background: #FBE4E4; color: #9A3B3B; }
        .fab { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); width: 58px; height: 58px; border-radius: 50%; background: #6B2737; border: none; box-shadow: 0 8px 20px rgba(107,39,55,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 40; color: #FAF3F0; font-size: 26px; }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(43,31,34,0.4); display: none; align-items: flex-end; z-index: 50; }
        .sheet-overlay.show { display: flex; }
        .sheet { background: #FAF3F0; width: 100%; border-top-left-radius: 26px; border-top-right-radius: 26px; padding: 18px 20px 26px; max-width: 480px; margin: 0 auto; max-height: 85vh; overflow-y: auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .sheet-title { font-family: 'Amiri', serif; font-size: 20px; font-weight: 700; color: #6B2737; }
        .label { display: block; font-size: 12px; color: #8B7377; margin-bottom: 5px; margin-top: 10px; }
        .input { width: 100%; border: 1px solid #E7D3D6; background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-family: 'Tajawal', sans-serif; color: #2B1F22; outline: none; }
        .form-row-3 { display: flex; gap: 8px; margin-top: 2px; }
        .form-field-group { flex: 1; min-width: 0; }
        .paid-toggle-row { display: flex; gap: 8px; margin-top: 4px; }
        .paid-toggle-btn { flex: 1; border: 1px solid #E7D3D6; background: #fff; color: #8B7377; border-radius: 12px; padding: 9px 10px; font-size: 13px; font-family: 'Tajawal', sans-serif; cursor: pointer; }
        .paid-toggle-btn.active-unpaid { background: #FBE4E4; color: #9A3B3B; border-color: #F0B8B8; }
        .paid-toggle-btn.active-paid { background: #E4F1E6; color: #2E6B3E; border-color: #B7DDBE; }
        .upload-btn { width: 100%; border: 1.5px dashed #D9BEC3; background: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13.5px; color: #6B2737; cursor: pointer; font-family: 'Tajawal', sans-serif; }
        .submit-btn { width: 100%; margin-top: 20px; background: #6B2737; color: #FAF3F0; border: none; border-radius: 14px; padding: 13px 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Tajawal', sans-serif; }
        .empty-state { text-align: center; padding: 50px 20px; color: #B49AA0; }
        .image-viewer-overlay { position: fixed; inset: 0; background: rgba(20,10,12,0.88); display: none; align-items: center; justify-content: center; z-index: 60; padding: 24px; }
        .image-viewer-overlay.show { display: flex; }
        .image-viewer-overlay img { max-width: 100%; max-height: 85vh; border-radius: 16px; }
        .image-viewer-close { position: absolute; top: 24px; left: 24px; background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .images-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .form-images-row { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; }
        .custom-prompt-overlay { position: fixed; inset: 0; background: rgba(43,31,34,0.5); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .custom-prompt-overlay.show { display: flex; }
        .custom-prompt-card { background: #FAF3F0; width: 100%; max-width: 340px; border-radius: 22px; padding: 22px 20px 20px; box-shadow: 0 12px 30px rgba(43,31,34,0.25); text-align: center; animation: promptPop .18s ease-out; }
        @keyframes promptPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .custom-prompt-icon { width: 46px; height: 46px; border-radius: 14px; background: #F3DEE1; color: #6B2737; font-size: 22px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
        .custom-prompt-title { font-family: 'Amiri', serif; font-size: 19px; font-weight: 700; color: #6B2737; margin-bottom: 6px; }
        .custom-prompt-text { color: #8B7377; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
        .custom-prompt-input { width: 100%; border: 1px solid #E7D3D6; background: #fff; border-radius: 12px; padding: 11px 12px; font-size: 15px; font-family: 'Tajawal', sans-serif; color: #2B1F22; outline: none; text-align: center; margin-bottom: 18px; }
        .custom-prompt-input:focus { border-color: #C9A9AF; }
        .custom-prompt-actions { display: flex; gap: 10px; }
        .custom-prompt-cancel { flex: 1; background: #fff; color: #8B7377; border: 1px solid #E7D3D6; border-radius: 12px; padding: 11px 10px; font-size: 14px; font-family: 'Tajawal', sans-serif; font-weight: 700; cursor: pointer; }
        .custom-prompt-ok { flex: 1; background: #6B2737; color: #FAF3F0; border: none; border-radius: 12px; padding: 11px 10px; font-size: 14px; font-family: 'Tajawal', sans-serif; font-weight: 700; cursor: pointer; }
        .form-thumb { position: relative; width: 54px; height: 54px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .form-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .form-thumb .remove-x { position: absolute; top: 2px; left: 2px; background: rgba(43,31,34,0.65); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .upload-row { display: flex; gap: 8px; }
        .upload-row .upload-btn { flex: 1; padding: 10px; font-size: 12.5px; }
        .wa-btn { background: #E4F1E6; color: #2E6B3E; }
        .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .gallery-nav.prev { right: 12px; }
        .gallery-nav.next { left: 12px; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const DB_NAME = "orderTrackerDB";
        const STORE_NAME = "appdata";
        let customers = [];
        let db;

        function openDB() {
            return new Promise(function(resolve, reject) {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = function(e) {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        d.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e); };
            });
        }

        function loadCustomers() {
            return new Promise(function(resolve) {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get("customers");
                req.onsuccess = function() { resolve(req.result || []); };
                req.onerror = function() { resolve([]); };
            });
        }

        function persistCustomers() {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(customers, "customers");
        }

        async function initApp() {
            try {
                db = await openDB();
                customers = await loadCustomers();
            } catch (e) {
                customers = [];
            }
            render();
        }

        let statusFilter = "all";
        let deliveryFilter = "all";
        let paidFilter = "all";
        let paymentMethodFilter = "all";
        let supplierFilter = "all";
        let dateFrom = "";
        let dateTo = "";
        let searchQuery = "";
        let showFilters = false;
        let showForm = false;
        let targetCustomerId = "new";
        let expanded = {};

        function todayStr() {
            const d = new Date();
            const m = (d.getMonth() + 1).toString().padStart(2, '0');
            const day = d.getDate().toString().padStart(2, '0');
            return `${d.getFullYear()}-${m}-${day}`;
        }
        
        // Form Fields State
        let formImages = [];
        let isPaid = false;
        let formCustName = "";
        let formPhone = "";
        let formSize = "";
        let formDeliveryPoint = "";
        let formAmount = "";
        let formDeposit = "";
        let formSupplier = "";
        let formOrderDate = todayStr();
        let formPaymentMethod = "";
        let paymentMethodPickerFor = null;

        // Customer edit (name / whatsapp)
        let editingCustomerId = null;
        let editName = "";
        let editPhone = "";
        let customerMenuFor = null;

        // Export / print
        let exportScope = null; // 'all' | 'filtered' | {id, name}

        // Image viewer (supports multiple images per order)
        let viewingGallery = null; // { images: [...], index: 0 }

        // Pagination: how many orders to render at once (loads more on scroll)
        let visibleCount = 25;
        let hasMoreOrders = false;

        // Editing an existing order (null = adding a new order)
        let editingItemFor = null; // { custId, itemId }

        function save() {
            persistCustomers();
            render();
        }

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function render() {
            const prevSearchEl = document.getElementById('searchInput');
            const searchHadFocus = prevSearchEl && document.activeElement === prevSearchEl;
            const searchCursor = searchHadFocus ? prevSearchEl.selectionStart : null;

            let allItems = [];
            for (let i = 0; i < customers.length; i++) {
                if (customers[i].items && Array.isArray(customers[i].items)) {
                    allItems = allItems.concat(customers[i].items);
                }
            }

            const deliveryPointsSet = {};
            const suppliersSet = {};
            for (let i = 0; i < allItems.length; i++) {
                if (allItems[i].deliveryPoint) deliveryPointsSet[allItems[i].deliveryPoint] = true;
                if (allItems[i].supplier) suppliersSet[allItems[i].supplier] = true;
            }
            const deliveryPoints = Object.keys(deliveryPointsSet);
            const suppliers = Object.keys(suppliersSet);

            const activeFilterCount = (deliveryFilter !== "all" ? 1 : 0) + (paidFilter !== "all" ? 1 : 0) + (paymentMethodFilter !== "all" ? 1 : 0) + (supplierFilter !== "all" ? 1 : 0) + (dateFrom ? 1 : 0) + (dateTo ? 1 : 0);

            const visibleCustomers = [];
            const query = searchQuery.trim().toLowerCase();
            for (let i = 0; i < customers.length; i++) {
                const c = customers[i];
                if (query && !(c.name || "").toLowerCase().includes(query)) continue;

                const filteredItems = (c.items || []).filter(function(it) {
                    if (statusFilter !== "all" && it.status !== statusFilter) return false;
                    if (deliveryFilter !== "all" && it.deliveryPoint !== deliveryFilter) return false;
                    if (paidFilter === "paid" && !it.paid) return false;
                    if (paidFilter === "unpaid" && it.paid) return false;
                    if (paymentMethodFilter !== "all" && it.paymentMethod !== paymentMethodFilter) return false;
                    if (supplierFilter !== "all" && it.supplier !== supplierFilter) return false;
                    if (dateFrom && (!it.orderDate || it.orderDate < dateFrom)) return false;
                    if (dateTo && (!it.orderDate || it.orderDate > dateTo)) return false;
                    return true;
                });

                if (filteredItems.length > 0) {
                    visibleCustomers.push({
                        id: c.id,
                        name: c.name,
                        phone: c.phone,
                        items: filteredItems
                    });
                }
            }
            // تجميع الطلبات المفلترة فقط لحساب الإحصائيات العلوية ديناميكياً
            let filteredAllItems = [];
            for (let i = 0; i < visibleCustomers.length; i++) {
                filteredAllItems = filteredAllItems.concat(visibleCustomers[i].items);
            }

            const pendingCount = filteredAllItems.filter(function(i) { return i.status === "preparing"; }).length;
            const unpaidTotal = filteredAllItems.filter(function(i) { return !i.paid && i.amount; }).reduce(function(sum, i) { 
                const total = parseFloat(i.amount) || 0;
                const dep = parseFloat(i.deposit) || 0;
                return sum + Math.max(total - dep, 0); 
            }, 0);
            const unpaidLabel = deliveryFilter !== "all" ? ("المتبقي · " + deliveryFilter) : "غير مدفوع";
            
            const totalFilteredItems = visibleCustomers.reduce(function(sum, c) { return sum + c.items.length; }, 0);
            let itemsShownSoFar = 0;
            const pagedCustomers = [];
            for (let i = 0; i < visibleCustomers.length; i++) {
                if (itemsShownSoFar >= visibleCount) break;
                const c = visibleCustomers[i];
                const remaining = visibleCount - itemsShownSoFar;
                const itemsSlice = c.items.slice(0, remaining);
                pagedCustomers.push({ id: c.id, name: c.name, phone: c.phone, items: itemsSlice });
                itemsShownSoFar += itemsSlice.length;
            }
            hasMoreOrders = itemsShownSoFar < totalFilteredItems;

            let html = `
                <div class="header">
                    <div class="header-top">
                        <div class="brand-mark">🛍️</div>
                        <div style="flex:1;">
                            <div class="header-title">دفتر الطلبات</div>
                            <div class="header-sub">تابعي طلبات زبوناتك بدون ما تنسي شي</div>
                        </div>
                        <a class="icon-btn" href="./products.html" style="background:rgba(250,243,240,0.15); border-radius:12px; width:38px; height:38px; color:#FAF3F0; font-size:17px; text-decoration:none; display:flex; align-items:center; justify-content:center;">🛍️</a>
                        <button class="icon-btn" style="background:rgba(250,243,240,0.15); border-radius:12px; width:38px; height:38px; color:#FAF3F0; font-size:17px;" onclick="exportScope='menu'; render();">📤</button>
                    </div>
                    <div class="stats-row">
                        <div class="stat-tag">
                            <span class="stat-num">${allItems.length}</span>
                            <span class="stat-label">كل الطلبات</span>
                        </div>
                        <div class="stat-tag" style="background: #FDF0D8;">
                            <span class="stat-num" style="color: #8A6A1F;">${pendingCount}</span>
                            <span class="stat-label" style="color: #8A6A1F;">قيد التجهيز</span>
                        </div>
                        <div class="stat-tag" style="background: #FBE4E4;">
                            <span class="stat-num" style="color: #9A3B3B;">${unpaidTotal}</span>
                            <span class="stat-label" style="color: #9A3B3B;" title="${unpaidLabel}">${unpaidLabel}</span>
                        </div>
                    </div>
                </div>

                <div style="padding: 18px 20px 0;">
                    <input type="text" class="input" style="border-radius:14px;" placeholder="🔍 ابحثي باسم الزبونة..." value="${searchQuery}" oninput="searchQuery=this.value; visibleCount=25; render();" id="searchInput">
                </div>

                <div class="filter-row">
                    <button class="filter-btn ${statusFilter === 'all' ? 'active' : ''}" onclick="setStatusFilter('all')">الكل</button>
                    <button class="filter-btn ${statusFilter === 'preparing' ? 'active' : ''}" onclick="setStatusFilter('preparing')">قيد التجهيز</button>
                    <button class="filter-btn ${statusFilter === 'delivered' ? 'active' : ''}" onclick="setStatusFilter('delivered')">تم التوصيل</button>
                    <button class="filter-icon-btn ${activeFilterCount > 0 ? 'active' : ''}" onclick="toggleShowFilters()">
                        ⚙️ ${activeFilterCount > 0 ? `<span style="position:absolute;top:-4px;left:-4px;background:#6B2737;color:#fff;font-size:9px;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;">${activeFilterCount}</span>` : ''}
                    </button>
                </div>

                <div class="more-filters ${showFilters ? 'show' : ''}">
                    <div class="filter-field">
                        <label class="filter-label">نقطة التسليم</label>
                        <select class="filter-select" onchange="deliveryFilter=this.value; visibleCount=25; render();">
                            <option value="all">كل النقاط</option>
                            ${deliveryPoints.map(function(p) { return `<option value="${p}" ${deliveryFilter === p ? 'selected' : ''}>${p}</option>`; }).join('')}
                        </select>
                    </div>
                    <div class="filter-field">
                        <label class="filter-label">المورد</label>
                        <select class="filter-select" onchange="supplierFilter=this.value; visibleCount=25; render();">
                            <option value="all">كل الموردين</option>
                            ${suppliers.map(function(s) { return `<option value="${s}" ${supplierFilter === s ? 'selected' : ''}>${s}</option>`; }).join('')}
                        </select>
                    </div>
                    <div class="filter-field">
                        <label class="filter-label">الدفع</label>
                        <select class="filter-select" onchange="paidFilter=this.value; visibleCount=25; render();">
                            <option value="all">الكل</option>
                            <option value="paid" ${paidFilter === 'paid' ? 'selected' : ''}>مدفوع</option>
                            <option value="unpaid" ${paidFilter === 'unpaid' ? 'selected' : ''}>غير مدفوع</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label class="filter-label">طريقة الدفع</label>
                        <select class="filter-select" onchange="paymentMethodFilter=this.value; visibleCount=25; render();">
                            <option value="all">الكل</option>
                            <option value="كريمي" ${paymentMethodFilter === 'كريمي' ? 'selected' : ''}>كريمي</option>
                            <option value="النجم" ${paymentMethodFilter === 'النجم' ? 'selected' : ''}>النجم</option>
                            <option value="نقد" ${paymentMethodFilter === 'نقد' ? 'selected' : ''}>نقد</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label class="filter-label">من تاريخ</label>
                        <input type="date" class="filter-select" value="${dateFrom}" onchange="dateFrom=this.value; visibleCount=25; render();">

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 1000;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w >= h) {
                            h = Math.round(h * (maxDim / w));
                            w = maxDim;
                        } else {
                            w = Math.round(w * (maxDim / h));
                            h = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    let dataUrl;
                    try {
                        dataUrl = canvas.toDataURL('image/jpeg', 0.72);
                    } catch (err) {
                        dataUrl = e.target.result;
                    }
                    callback(dataUrl);
                };
                img.onerror = function() {
                    callback(e.target.result);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleCameraImage(input) {
            const file = input.files[0];
            if (file) {
                compressImage(file, function(dataUrl) {
                    formImages.push(dataUrl);

            }
            input.value = "";
        }

        function handleGalleryImages(input) {
            const files = Array.from(input.files || []);
            files.forEach(function(file) {
                compressImage(file, function(dataUrl) {
                    formImages.push(dataUrl);
                    render();
                });
            });
            input.value = "";

        function submitForm() {
            if (isPaid && !formPaymentMethod) {
                alert('يرجى اختيار طريقة الدفع');
                return;
            }

            if (editingItemFor) {
                for (let i = 0; i < customers.length; i++) {
                    if (customers[i].id === editingItemFor.custId) {
                        for (let j = 0; j < customers[i].items.length; j++) {
                            if (customers[i].items[j].id === editingItemFor.itemId) {
                                const it = customers[i].items[j];
                                it.size = formSize.trim();
                                it.images = formImages.slice();
                                it.deliveryPoint = formDeliveryPoint.trim();
                                it.paid = isPaid;
                                it.paymentMethod = isPaid ? formPaymentMethod : null;
                                it.amount = formAmount.trim();
                                it.deposit = formDeposit.trim();
                                it.supplier = formSupplier.trim();
                                it.orderDate = formOrderDate || todayStr();
                                break;
                            }
                        }
                        break;
                    }
                }
                save();
                closeForm();
                return;
            }

            const newItem = {
                id: uid(),
                size: formSize.trim(),
                images: formImages.slice(),
                status: "preparing",
                deliveryPoint: formDeliveryPoint.trim(),
                paid: isPaid,
                paymentMethod: isPaid ? formPaymentMethod : null,
                amount: formAmount.trim(),
                deposit: formDeposit.trim(),
                supplier: formSupplier.trim(),
                orderDate: formOrderDate || todayStr(),
                createdAt: Date.now()
            };

            if (targetCustomerId === 'new') {
                const name = formCustName.trim();
                if (!name) {
                    alert('يرجى ادخال اسم الزبونة');
                    return;
                }
                const newCust = { id: uid(), name: name, phone: formPhone.trim(), items: [newItem] };
                customers.unshift(newCust);
                expanded[newCust.id] = true;
            } else {
                let cust = null;
                for (let i = 0; i < customers.length; i++) {
                    if (customers[i].id === targetCustomerId) {
                        cust = customers[i];
                        break;
                    }
                }
                if (cust) {
                    if (!cust.items) cust.items = [];
                    cust.items.unshift(newItem);
                    expanded[cust.id] = true;
                }
            }
            save();
            closeForm();
        }

        function updateOrderDate(custId, itemId, newDate) {
            for (let i = 0; i < customers.length; i++) {
                if (customers[i].id === custId) {
                    for (let j = 0; j < customers[i].items.length; j++) {
                        if (customers[i].items[j].id === itemId) {
                            customers[i].items[j].orderDate = newDate;
                            save();
                            return;
                        }
                    }
                }
            }
        }

        function toggleStatus(custId, itemId) {
            for (let i = 0; i < customers.length; i++) {
                if (customers[i].id === custId) {
                    for (let j = 0; j < customers[i].items.length; j++) {
                        if (customers[i].items[j].id === itemId) {
                            customers[i].items[j].status = customers[i].items[j].status === 'preparing' ? 'delivered' : 'preparing';
                            save();
                            return;
                        }
                    }
                }
            }
        }

        function addPayment(custId, itemId) {
            for (let i = 0; i < customers.length; i++) {
                if (customers[i].id === custId) {
                    for (let j = 0; j < customers[i].items.length; j++) {
                        if (customers[i].items[j].id === itemId) {
                            const it = customers[i].items[j];
                            const totalAmount = parseFloat(it.amount) || 0;
                            const currentDeposit = parseFloat(it.deposit) || 0;
                            const remaining = Math.max(totalAmount - currentDeposit, 0);
                                    showCustomPrompt("أدخلي المبلغ المضاف كدفعة (المتبقي: " + remaining + "):", "", function(input) {
            if (input === null || input === "") return;
            const addedAmount = parseFloat(input);
            if (!addedAmount || addedAmount <= 0) return;
            const newDeposit = currentDeposit + addedAmount;
            it.deposit = String(Math.min(newDeposit, totalAmount));
            if (totalAmount > 0 && newDeposit >= totalAmount) {
                paymentMethodPickerFor = { custId: custId, itemId: itemId };
                save();
            } else {
                save();
            }
        });
                        }
                    }
                }
            }
        }

        function togglePaid(custId, itemId) {
            for (let i = 0; i < customers.length; i++) {
                if (customers[i].id === custId) {
                    for (let j = 0; j < customers[i].items.length; j++) {
                        if (customers[i].items[j].id === itemId) {
                            const it = customers[i].items[j];
                            if (it.paid) {
                                it.paid = false;
                                it.paymentMethod = null;
                                save();
                            } else {
                                paymentMethodPickerFor = { custId: custId, itemId: itemId };
                                render();
                            }
                            return;
                        }
                    }
                }
            }
        }

        function selectPaymentMethod(method) {
            if (!paymentMethodPickerFor) return;
            const custId = paymentMethodPickerFor.custId;
            const itemId = paymentMethodPickerFor.itemId;
            for (let i = 0; i < customers.length; i++) {
                if (customers[i].id === custId) {
                    for (let j = 0; j < customers[i].items.length; j++) {
                        if (customers[i].items[j].id === itemId) {
                            customers[i].items[j].paid = true;
                            customers[i].items[j].paymentMethod = method;
                            break;
                        }
                    }
                    break;
                }
            }
            paymentMethodPickerFor = null;
            save();
        }

        function closePaymentPicker() {
            paymentMethodPickerFor = null;
            render();
        }

        function removeItem(custId, itemId) {
            for (let i = 0; i < customers.length; i++) {
                if (customers[i].id === custId) {
                    customers[i].items = customers[i].items.filter(function(i) { return i.id !== itemId; });
                    if (customers[i].items.length === 0) {
                        customers.splice(i, 1);
                    }
                    save();
                    return;
                }
            }
        }

        function removeCustomer(custId) {
            if (confirm('هل أنت متأكد من حذف الزبونة وكل طلباتها؟')) {
                customers = customers.filter(function(c) { return c.id !== custId; });
                save();
            }
        }

        // ---- Customer edit (name / whatsapp) ----
        function openEditCustomer(custId) {
            const c = customers.find(function(c) { return c.id === custId; });
            if (!c) return;
            editingCustomerId = custId;
            editName = c.name || "";
            editPhone = c.phone || "";
            customerMenuFor = null;
            render();
        }
        function closeEditCustomer() {
            editingCustomerId = null;
            render();
        }
        function saveEditCustomer() {
            const c = customers.find(function(c) { return c.id === editingCustomerId; });
            if (!c) return;
            const name = editName.trim();
            if (!name) {
                alert('يرجى ادخال اسم الزبونة');
                return;
            }
            c.name = name;
            c.phone = editPhone.trim();
            editingCustomerId = null;
            save();
        }

        // ---- WhatsApp ----
        function openWhatsApp(custId) {
            const c = customers.find(function(c) { return c.id === custId; });
            if (!c || !c.phone) return;
            const digits = c.phone.replace(/[^0-9]/g, '');
            const msg = encodeURIComponent(`مرحباً ${c.name}، نود تحديثك بخصوص طلبك 🌸`);
            window.open(`https://wa.me/${digits}?text=${msg}`, '_blank');
        }

        // ---- Export / Print ----
        function getFilteredCustomers() {
            const query = searchQuery.trim().toLowerCase();
            const result = [];
            for (let i = 0; i < customers.length; i++) {
                const c = customers[i];
                if (query && !(c.name || "").toLowerCase().includes(query)) continue;
                const filteredItems = (c.items || []).filter(function(it) {
                    if (statusFilter !== "all" && it.status !== statusFilter) return false;
                    if (deliveryFilter !== "all" && it.deliveryPoint !== deliveryFilter) return false;
                    if (paidFilter === "paid" && !it.paid) return false;
                    if (paidFilter === "unpaid" && it.paid) return false;
                    if (paymentMethodFilter !== "all" && it.paymentMethod !== paymentMethodFilter) return false;
                    if (supplierFilter !== "all" && it.supplier !== supplierFilter) return false;
                    if (dateFrom && (!it.orderDate || it.orderDate < dateFrom)) return false;
                    if (dateTo && (!it.orderDate || it.orderDate > dateTo)) return false;
                    return true;
                });
                if (filteredItems.length > 0) {
                    result.push({ id: c.id, name: c.name, items: filteredItems });
                }
            }
            return result;
        }

        function buildRows(customersList) {
            const rows = [];
            customersList.forEach(function(c) {
                (c.items || []).forEach(function(it) {
                    const amount = parseFloat(it.amount) || 0;
                    const deposit = parseFloat(it.deposit) || 0;
                    const remaining = it.paid ? 0 : Math.max(amount - deposit, 0);
                    rows.push({
                        customer: c.name || "",
                        date: it.orderDate || "",
                        size: it.size || "",
                        delivery: it.deliveryPoint || "",
                        supplier: it.supplier || "",
                        amount: amount,
                        deposit: deposit,
                        remaining: remaining,
                        status: it.status === 'delivered' ? 'تم التوصيل' : 'قيد التجهيز',
                        paid: it.paid ? 'مدفوع' : 'غير مدفوع',
                        paymentMethod: it.paymentMethod || ''
                    });
                });
            });
            return rows;
        }

        function csvEscape(val) {
            const s = String(val === undefined || val === null ? '' : val);
            if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }

        function toCSV(rows) {
            const headers = ['الزبونة', 'التاريخ', 'المقاس', 'نقطة التسليم', 'المورد', 'المبلغ', 'العربون', 'المتبقي', 'الحالة', 'الدفع', 'طريقة الدفع'];
            const lines = [headers.map(csvEscape).join(',')];
            rows.forEach(function(r) {
                lines.push([r.customer, r.date, r.size, r.delivery, r.supplier, r.amount, r.deposit, r.remaining, r.status, r.paid, r.paymentMethod].map(csvEscape).join(','));
            });
            return '\uFEFF' + lines.join('\n');
        }

        function downloadCSV(rows, filename) {
            const csv = toCSV(rows);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportAllExcel() {
            downloadCSV(buildRows(customers), 'كل_الطلبات.csv');
            exportScope = null;
            render();
        }
        function exportFilteredExcel() {
            downloadCSV(buildRows(getFilteredCustomers()), 'الطلبات_المفلترة.csv');
            exportScope = null;
            render();
        }
        function exportCustomerExcel(custId) {
            const c = customers.find(function(c) { return c.id === custId; });
            if (!c) return;
            downloadCSV(buildRows([c]), `كشف_حساب_${c.name}.csv`);
            exportScope = null;
            render();
        }

        function printRows(rows, title) {
            const totalAmount = rows.reduce(function(s, r) { return s + r.amount; }, 0);
            const totalDeposit = rows.reduce(function(s, r) { return s + r.deposit; }, 0);
            const totalRemaining = rows.reduce(function(s, r) { return s + r.remaining; }, 0);
            const win = window.open('', '_blank');
            if (!win) { alert('يرجى السماح بفتح النوافذ المنبثقة للطباعة'); return; }
            const tableRows = rows.map(function(r) {
                return `<tr>
                    <td>${r.customer}</td><td>${r.date}</td><td>${r.size}</td><td>${r.delivery}</td><td>${r.supplier}</td>
                    <td>${r.amount}</td><td>${r.deposit}</td><td>${r.remaining}</td>
                    <td>${r.status}</td><td>${r.paid}${r.paymentMethod ? ' - ' + r.paymentMethod : ''}</td>
                </tr>`;
            }).join('');
            win.document.write(`
                <html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${title}</title>
                <style>
                    body { font-family: Tahoma, Arial, sans-serif; padding: 20px; color: #2B1F22; }
                    h1 { font-size: 20px; color: #6B2737; }
                    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12.5px; }
                    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: right; }
                    th { background: #F3DEE1; color: #6B2737; }
                    tfoot td { font-weight: bold; background: #FAF3F0; }
                </style></head><body>
                <h1>${title}</h1>
                <div>تاريخ التصدير: ${todayStr()}</div>
                <table>
                    <thead><tr><th>الزبونة</th><th>التاريخ</th><th>المقاس</th><th>نقطة التسليم</th><th>المورد</th><th>المبلغ</th><th>العربون</th><th>المتبقي</th><th>الحالة</th><th>الدفع</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                    <tfoot><tr><td colspan="5">الإجمالي</td><td>${totalAmount}</td><td>${totalDeposit}</td><td>${totalRemaining}</td><td colspan="2"></td></tr></tfoot>
                </table>
                </body></html>
            `);
            win.document.close();
            win.focus();
            setTimeout(function() { win.print(); }, 300);
        }

        function printAll() {
            printRows(buildRows(customers), 'كل الطلبات');
            exportScope = null;
            render();
        }
        function printFiltered() {
            printRows(buildRows(getFilteredCustomers()), 'الطلبات المفلترة');
            exportScope = null;
            render();
        }
        function printCustomer(custId) {
            const c = customers.find(function(c) { return c.id === custId; });
            if (!c) return;
            printRows(buildRows([c]), 'كشف حساب - ' + c.name);
            exportScope = null;
            render();
        }
        function showCustomPrompt(msg, def, cb) {
    const modal = document.getElementById('customPromptModal');
    const textEl = document.getElementById('customPromptText');
    const inputEl = document.getElementById('customPromptInput');
    const okBtn = document.getElementById('customPromptOk');
    const cancelBtn = document.getElementById('customPromptCancel');

    textEl.innerText = msg;
    inputEl.value = def || '';
    modal.classList.add('show');
    setTimeout(function() { inputEl.focus(); }, 50);

    function close(result) {
        modal.classList.remove('show');
        document.removeEventListener('keydown', onKeyDown);
        modal.onclick = null;
        if (cb) cb(result);
    }
    function onKeyDown(e) {
        if (e.key === 'Enter') close(inputEl.value);
        if (e.key === 'Escape') close(null);
    }

    okBtn.onclick = function() { close(inputEl.value); };
    cancelBtn.onclick = function() { close(null); };
    modal.onclick = function(e) { if (e.target === modal) close(null); };
    document.addEventListener('keydown', onKeyDown);
}

    
        initApp();

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js").catch(function () {});
            });
        }
    </script>
<div id="customPromptModal" class="custom-prompt-overlay">
    <div class="custom-prompt-card">
        <div class="custom-prompt-icon">💰</div>
        <h3 id="customPromptTitle" class="custom-prompt-title">إضافة دفعة جديدة</h3>
        <p id="customPromptText" class="custom-prompt-text"></p>
        <input type="number" id="customPromptInput" placeholder="أدخل المبلغ..." class="custom-prompt-input" inputmode="decimal">
        <div class="custom-prompt-actions">
            <button id="customPromptCancel" class="custom-prompt-cancel">إلغاء</button>
            <button id="customPromptOk" class="custom-prompt-ok">تأكيد</button>
        </div>
    </div>
</div>
</body>
