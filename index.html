<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر الطلبات والعملاء</title>
    
    <!-- ⬇️ أضيفي كود التحديث هنا مباشرة -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.update();
                }
            });
        }
    </script>
    
</head>
<body>
    <!-- باقي محتوى الصفحة هنا -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر الطلبات والعملاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: #FAF3F0; color: #2B1F22; padding: 12px; padding-bottom: 90px; }
        
        .header { background: linear-gradient(135deg, #6B2737 0%, #8A3A4C 100%); color: #fff; padding: 14px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-title h1 { font-size: 18px; font-weight: 800; }
        .header-title p { font-size: 11px; opacity: 0.85; }
        .header-btn { background: #fff; color: #6B2737; border: none; padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        
        .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(107,39,55,0.05); border: 1px solid #E7D3D6; }
        .card-title { color: #6B2737; font-size: 14px; font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .label { display: block; font-size: 11px; color: #8B7377; margin: 8px 0 3px; font-weight: 700; }
        .input { width: 100%; padding: 8px 10px; border: 1px solid #E7D3D6; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 12.5px; outline: none; background: #fff; color: #2B1F22; }
        
        .btn { background: #6B2737; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 700; font-family: 'Tajawal', sans-serif; font-size: 13px; cursor: pointer; margin-top: 10px; }
        .btn-outline { background: #fff; color: #6B2737; border: 1px dashed #D9BEC3; }

        /* نافذة اختيار المنتجات المخصصة (Modal) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(43,31,34,0.5); display: none; align-items: flex-end; z-index: 100; }
        .modal-overlay.show { display: flex; }
        .modal-sheet { background: #FAF3F0; width: 100%; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 16px; max-height: 85vh; overflow-y: auto; max-width: 480px; margin: 0 auto; }
        
        .product-select-box { background: #fff; border: 1px solid #E7D3D6; border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .product-select-box:hover { background: #FBEDEE; }
        .select-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; background: #FBEDEE; display: flex; align-items: center; justify-content: center; color: #C9A9AF; font-size: 16px; flex-shrink: 0; }

        .order-card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #E7D3D6; position: relative; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .order-name { font-weight: 800; font-size: 13px; color: #6B2737; }
        .order-badge { background: #F3DEE1; color: #6B2737; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
        
        .order-info { font-size: 11.5px; color: #523F43; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .actions-row { display: flex; gap: 6px; margin-top: 8px; }
        .action-btn { flex: 1; padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid #E7D3D6; text-align: center; font-family: 'Tajawal', sans-serif; background: #fff; color: #6B2737; }
        .action-btn-danger { background: #FDE8E8; color: #C53030; border-color: #F8B4B4; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>دفتر الطلبات والعملاء</h1>
            <p>إدارة الطلبات والخصم التلقائي من المخزون</p>
        </div>
        <a href="./products.html" class="header-btn">📦 الكتالوج والمخزون</a>
    </div>

    <!-- بطاقة إضافة طلب جديد -->
    <div class="card">
        <div class="card-title">تسجيل طلب جديد</div>
        
        <label class="label">اسم الزبونة</label>
        <input type="text" id="custName" class="input" placeholder="مثال: فاطمة أحمد">

        <label class="label">رقم الهاتف (اختياري)</label>
        <input type="tel" id="custPhone" class="input" placeholder="77xxxxxxx">

        <label class="label">المنطقة / نقطة التسليم</label>
        <input type="text" id="custLocation" class="input" placeholder="مثال: تعز - الحوبان / جولة المرور">

        <label class="label">اختر المنتج من المخزون</label>
        <div id="selectedProductDisplay" class="product-select-box" onclick="openProductModal()">
            <div class="select-thumb" id="modalSelectedThumb">📷</div>
            <div>
                <div id="modalSelectedTitle" style="font-weight: 800; font-size: 12px; color: #6B2737;">-- اضغط لاختيار منتج من الكتالوج --</div>
                <div id="modalSelectedSub" style="font-size: 10.5px; color: #8B7377;">انقر لاختيار القطعة واللون والمقاس</div>
            </div>
        </div>
        <input type="hidden" id="selectedProductId">
        <input type="hidden" id="selectedColorId">
        <input type="hidden" id="selectedSize">

        <div style="display: flex; gap: 8px;">
            <div style="flex:1;">
                <label class="label">السعر (ر.ي)</label>
                <input type="number" id="orderPrice" class="input" placeholder="0">
            </div>
            <div style="flex:1;">
                <label class="label">الحالة</label>
                <select id="orderStatus" class="input">
                    <option value="جديد">جديد</option>
                    <option value="قيد التجهيز">قيد التجهيز</option>
                    <option value="جاهز للتسليم">جاهز للتسليم</option>
                    <option value="تم التسليم">تم التسليم</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="saveOrder()">حفظ الطلب وخصم الكمية تلقائياً</button>
    </div>

    <!-- قائمة الطلبات -->
    <div class="card" style="background:none; border:none; box-shadow:none; padding:0;">
        <div class="card-title" style="margin-bottom:8px;">سجل الطلبات الحالية</div>
        <div id="ordersList"></div>
    </div>

    <!-- نافذة اختيار المنتجات الذكية مع البحث والصور -->
    <div class="modal-overlay" id="productModal" onclick="closeProductModal()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="font-weight: 800; font-size: 15px; color: #6B2737;">اختر المنتج من المخزون</div>
                <button onclick="closeProductModal()" style="background:none; border:none; font-size:18px; cursor:pointer; color:#6B2737;">✕</button>
            </div>
            
            <input type="text" id="modalSearchInput" class="input" placeholder="🔍 ابحث عن اسم المنتج أو النوع..." oninput="renderModalProducts()" style="margin-bottom: 10px;">
            
            <div id="modalProductsContainer"></div>
        </div>
    </div>

    <script>
        const DB_NAME = "orderTrackerDB";
        const STORE_NAME = "appdata";
        let db;
        let products = [];
        let orders = [];

        function openDB() {
            return new Promise(function(resolve, reject) {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = function(e) {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        d.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e); };
            });
        }

        async function init() {
            try {
                db = await openDB();
                const tx = db.transaction(STORE_NAME, "readonly");
                
                const pReq = tx.objectStore(STORE_NAME).get("products");
                pReq.onsuccess = function() { products = pReq.result || []; };

                const oReq = tx.objectStore(STORE_NAME).get("orders");
                oReq.onsuccess = function() {
                    orders = oReq.result || [];
                    renderOrders();
                };
            } catch(e) {
                products = [];
                orders = [];
                renderOrders();
            }
        }

        function openProductModal() {
            document.getElementById('productModal').classList.add('show');
            document.getElementById('modalSearchInput').value = "";
            renderModalProducts();
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('show');
        }

        function renderModalProducts() {
            const container = document.getElementById('modalProductsContainer');
            const searchVal = document.getElementById('modalSearchInput').value.trim().toLowerCase();

            const filtered = products.filter(p => {
                const text = (p.name + " " + (p.category || "")).toLowerCase();
                return !searchVal || text.includes(searchVal);
            });

            if(filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#8B7377; padding:20px; font-size:12px;">لا توجد منتجات مطابقة للبحث أو المخزون فارغ</div>';
                return;
            }

            container.innerHTML = filtered.map(p => {
                const coverImg = p.colors && p.colors[0] && p.colors[0].images && p.colors[0].images[0];
                return `
                    <div style="background:#fff; border:1px solid #E7D3D6; border-radius:10px; padding:8px; margin-bottom:8px;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                            ${coverImg ? `<img src="${coverImg}" style="width:40px; height:40px; border-radius:6px; object-fit:cover;">` : `<div class="select-thumb" style="width:40px; height:40px; font-size:14px;">📷</div>`}
                            <div style="flex:1;">
                                <div style="font-weight:800; font-size:12px; color:#6B2737;">${p.name}</div>
                                <div style="font-size:10px; color:#8B7377;">[${p.category || 'عام'}] - مصدر: ${p.source} | ⚖️ ${p.weightFrom || 40}-${p.weightTo || 65} كغ</div>
                            </div>
                        </div>
                        <div style="display:flex; gap:4px; flex-wrap:wrap; border-top:1px solid #FAF3F0; padding-top:6px;">
                            ${(p.colors || []).map(c => `
                                <div style="font-size:10px; background:#FAF3F0; border:1px solid #E7D3D6; border-radius:6px; padding:4px 8px; width:100%;">
                                    <div style="display:flex; align-items:center; gap:4px; font-weight:700; margin-bottom:3px;">
                                        <span style="width:8px; height:8px; border-radius:50%; background:${c.hex}; display:inline-block;"></span>
                                        ${c.name}:
                                    </div>
                                    <div style="display:flex; gap:4px; flex-wrap:wrap;">
                                        ${Object.keys(c.sizes || {}).map(sz => `
                                            <button onclick="selectProductItem('${p.id}', '${c.id}', '${sz}')" style="background:#fff; border:1px solid #6B2737; color:#6B2737; border-radius:4px; padding:2px 6px; font-size:9.5px; font-weight:700; cursor:pointer;">
                                                ${sz} (متوفر: ${c.sizes[sz]})
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectProductItem(pId, cId, size) {
            const p = products.find(x => x.id === pId);
            if(!p) return;
            const c = p.colors.find(x => x.id === cId);
            if(!c) return;

            document.getElementById('selectedProductId').value = p.id;
            document.getElementById('selectedColorId').value = c.id;
            document.getElementById('selectedSize').value = size;

            const coverImg = c.images && c.images[0] ? c.images[0] : null;
            const thumbDiv = document.getElementById('modalSelectedThumb');
            if(coverImg) {
                thumbDiv.innerHTML = `<img src="${coverImg}" style="width:100%; height:100%; border-radius:8px; object-fit:cover;">`;
            } else {
                thumbDiv.innerHTML = "📷";
            }

            document.getElementById('modalSelectedTitle').innerText = `${p.name} - لون (${c.name}) - مقاس (${size})`;
            document.getElementById('modalSelectedSub').innerText = `المصدر: ${p.source} | متوفر بالمخزون: ${c.sizes[size]}`;

            closeProductModal();
        }

        function saveOrder() {
            const custName = document.getElementById('custName').value.trim();
            const custPhone = document.getElementById('custPhone').value.trim();
            const custLocation = document.getElementById('custLocation').value.trim();
            const pId = document.getElementById('selectedProductId').value;
            const cId = document.getElementById('selectedColorId').value;
            const size = document.getElementById('selectedSize').value;
            const price = parseFloat(document.getElementById('orderPrice').value) || 0;
            const status = document.getElementById('orderStatus').value;

            if(!custName) { alert('يرجى إدخال اسم الزبونة'); return; }
            if(!pId || !cId || !size) { alert('يرجى اختيار المنتج والمقاس من المخزون'); return; }

            // الخصم التلقائي من المخزون
            const p = products.find(x => x.id === pId);
            if(!p) { alert('المنتج غير موجود في الكتالوج'); return; }
            const c = p.colors.find(x => x.id === cId);
            if(!c || (c.sizes[size] || 0) <= 0) {
                alert('عذراً، هذا المقاس نفد تماماً من المخزون!');
                return;
            }

            c.sizes[size] -= 1; // خصم قطعة واحدة

            const newOrder = {
                id: Date.now().toString(36),
                custName,
                custPhone,
                custLocation,
                productName: p.name,
                colorName: c.name,
                size,
                price,
                status,
                date: new Date().toLocaleDateString('ar-EG')
            };

            orders.unshift(newOrder);
            persistData();
        }

        function persistData() {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(products, "products");
            tx.objectStore(STORE_NAME).put(orders, "orders");
            tx.oncomplete = function() {
                renderOrders();
                resetOrderForm();
            };
        }

        function resetOrderForm() {
            document.getElementById('custName').value = "";
            document.getElementById('custPhone').value = "";
            document.getElementById('custLocation').value = "";
            document.getElementById('selectedProductId').value = "";
            document.getElementById('selectedColorId').value = "";
            document.getElementById('selectedSize').value = "";
            document.getElementById('orderPrice').value = "";
            document.getElementById('modalSelectedThumb').innerHTML = "📷";
            document.getElementById('modalSelectedTitle').innerText = "-- اضغط لاختيار منتج من الكتالوج --";
            document.getElementById('modalSelectedSub').innerText = "انقر لاختيار القطعة واللون والمقاس";
        }

        function renderOrders() {
            const list = document.getElementById('ordersList');
            if(orders.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#8B7377; padding:20px; font-size:12px;">لا توجد طلبات مسجلة حتى الآن</div>';
                return;
            }

            list.innerHTML = orders.map(o => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-name">${o.custName}</span>
                        <span class="order-badge">${o.status}</span>
                    </div>
                    <div class="order-info">
                        <span>🛍️ المنتج: <b>${o.productName}</b></span>
                        <span>🎨 اللون: ${o.colorName}</span>
                    </div>
                    <div class="order-info">
                        <span>📏 المقاس: <b>${o.size}</b></span>
                        <span>💰 السعر: ${o.price} ر.ي</span>
                    </div>
                    <div class="order-info" style="color:#8B7377; font-size:10.5px;">
                        <span>📍 الموقع: ${o.custLocation || 'غير محدد'}</span>
                        <span>📅 ${o.date}</span>
                    </div>
                    <div class="actions-row">
                        <button class="action-btn action-btn-danger" onclick="deleteOrder('${o.id}')">حذف الطلب</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteOrder(id) {
            if(!confirm('هل تريد حذف هذا الطلب؟')) return;
            orders = orders.filter(x => x.id !== id);
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(orders, "orders");
            tx.oncomplete = function() { renderOrders(); };
        }

        init();
    </script>
</body>
</html>
